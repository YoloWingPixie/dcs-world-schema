  # ----------------------------------------------------------------------------
  # Lookup and rule tables: facts the extractors apply across records.
  # ----------------------------------------------------------------------------

  - series: radios
    table: bandRules
    note: >-
      The `band` of a radio whose DCS `panelRadio` name names none (e.g.
      `ARC-186`, `R-828`), from its whole tunable range (facts `minMHz`,
      `maxMHz`); tools/datamine/extract_radios.py, stamped hand-authored.
    evidence: >-
      Aviation radio band edges: HF ends at 30 MHz; the military UHF air band
      is 225-400 MHz; a set reaching 225 MHz from below is a combined V/UHF
      set; anything else (up to 225 MHz, the 30-88 MHz FM band included) is
      VHF.
    value:
      - band: HF
        when: {maxMHz: {"<=": 30}}
      - band: UHF
        when: {minMHz: {">=": 225}}
      - band: V/UHF
        when: {maxMHz: {">=": 225}}
      - band: VHF

  - series: radios
    table: guardMHz
    note: >-
      Emergency (guard) frequencies a radio of each band may cover; `guard` is
      whether one of its range segments covers one (stamped hand-authored).
    evidence: Aeronautical emergency frequencies 121.5 MHz (VHF) and 243.0 MHz (UHF).
    value:
      UHF: [243.0]
      VHF: [121.5]
      V/UHF: [121.5, 243.0]
      HF: []

  - series: radios
    table: stepKHz
    note: >-
      Tuning step per band (stamped hand-authored). DCS unit data has none; the
      cockpit radio devices' `GUI.range.step` (Mods/aircraft/*/Cockpit) is
      not linked to a `panelRadio` entry.
    evidence: Conventional 25 kHz VHF/UHF channel spacing.
    value:
      UHF: 25
      VHF: 25
      V/UHF: 25

  - series: airbases
    table: serviceTypes
    note: >-
      Terrain Radio.lua `role` -> communication type code of an airbase
      service's `serviceTypes` (tools/datamine/extract_theatres.py), stamped
      hand-authored.
    evidence: >-
      Communication type codes GND (ground control), TWR (tower) and APP
      (approach control); DCS 2.9.29.27468 terrains use exactly the roles
      ground, tower and approach.
    value:
      ground: GND
      tower: TWR
      approach: APP

  - series: threats
    table: natoDesignation
    note: >-
      Unit type -> the NATO designation (SA-n; else the western system name,
      or the radar's reporting name for a radar-only system) of the threat it
      launches or tracks for (tools/datamine/extract_threats.py):
      for units Scripts/Speech/NATO.lua does not name, and in place of NATO.lua
      radio callouts that are not formal names. An entry for a unit no threat
      takes its name from, or equal to NATO.lua's name, is an error.
    evidence: >-
      Public NATO designations and western system names. Overrides of
      NATO.lua (DCS 2.9.29.27468) callouts:
      the Igla units say "MANPADS" but all three fire the 9M39 Igla (Igla_1E)
      and DCS's own displayName calls each one SA-18 "Grouse", Igla-S included
      (the SA-24 "Grinch" 9M342 is not modelled); the Stinger units say
      "MANPADS", "Avenger" and "Linebacker" but are one threat, the FIM-92
      Stinger (a US system, no NATO reporting name); the ZSU-23-4 says "Zeus",
      a crew nickname, where NATO designates the vehicle ZSU-23-4 ("Gun Dish"
      is its radar).
    value:
      # Overrides of NATO.lua callouts.
      Igla manpad INS: SA-18
      SA-18 Igla manpad: SA-18
      SA-18 Igla-S manpad: SA-18
      Soldier stinger: Stinger
      M1097 Avenger: Stinger
      M6 Linebacker: Stinger
      ZSU-23-4 Shilka: ZSU-23-4
      # Units NATO.lua does not name.
      NASAMS_LN_B: NASAMS
      NASAMS_LN_C: NASAMS
      Dog Ear radar: Dog Ear
      HEMTT_C-RAM_Phalanx: C-RAM
      HQ-7_LN_P: HQ-7
      HQ-7_LN_SP: HQ-7
      SON_9: Fire Can
      Roland ADS: Roland
      CHAP_PantsirS1: SA-22
      CHAP_TorM2: SA-15
      CHAP_IRISTSLM_LN: IRIS-T SLM
      S-200_Launcher: SA-5

  - series: units
    table: natoReportingName
    note: >-
      Unit type -> the NATO reporting name of a ground vehicle or ship
      (tools/datamine/extract_units.py name_reporting): for units whose DCS
      displayName quotes none, and in place of a quoted system name on a unit
      NATO names on its own. An entry for a unit type no ground vehicle or
      ship record defines, or equal to the name DCS quotes, is an error.
    evidence: >-
      Public NATO reporting names of the S-300PS (SA-10 "Grumble") and 9K37
      Buk (SA-11 "Gadfly") radars; DCS 2.9.29.27468 quotes the system name and
      writes the part's own name unquoted after it: 40B6M tr
      `SAM SA-10 S-300 "Grumble" Flap Lid-A TR`, 5H63C 30H6_tr `... Flap
      Lid-B TR`, 40B6MD sr `... Clam Shell SR`, 64H6E sr `... Big Bird SR`,
      40B6MD sr_19J6 `... Tin Shield SR`, SA-11 LN 9A310M1 `SAM SA-11 Buk
      "Gadfly" Fire Dome TEL` (the TELAR's own radar), SA-11 SR 9S18M1 `...
      Snow Drift SR`. The launchers and command posts have no reporting name
      of their own and keep the system's.
    value:
      S-300PS 40B6M tr: Flap Lid A
      S-300PS 5H63C 30H6_tr: Flap Lid B
      S-300PS 40B6MD sr: Clam Shell
      S-300PS 64H6E sr: Big Bird
      S-300PS 40B6MD sr_19J6: Tin Shield
      SA-11 Buk LN 9A310M1: Fire Dome
      SA-11 Buk SR 9S18M1: Snow Drift

  - series: theatres
    table: aliases
    note: >-
      Theatre id -> other names the theatre goes by, emitted as the record's
      `aliases` (stamped hand-authored) for name lookups
      (tools/datamine/extract_theatres.py). An alias equal to the theatre's
      id, displayName or directory (ASCII case-insensitive, trimmed), one two
      theatres share, is an error; an entry for a theatre not installed is
      skipped (warned).
    evidence: >-
      Eagle Dynamics' product names for the terrains ("DCS: Nevada Test and
      Training Range Map", "DCS: Normandy 1944 Map", "DCS: Marianas WWII",
      "DCS: Cold War Germany") and the geographic names of the areas they
      cover (the Falkland Islands of the South Atlantic map, the Mariana
      Islands); DCS 2.9.29.27468 entry.lua names them Nevada, Normandy 2.0,
      MarianasWWII, Cold War Germany, South Atlantic and Marianas.
    value:
      Falklands: [Falkland Islands]
      GermanyCW: [Germany Cold War, Germany]
      MarianaIslands: [Mariana Islands]
      MarianaIslandsWWII: [Marianas WWII, Mariana Islands WWII]
      Nevada: [NTTR, Nevada Test and Training Range]
      Normandy: [Normandy 1944]

  - series: beacons
    table: tacanPlan
    note: >-
      The DME/TACAN channel plan the package's tacanFrequency, tacanChannel
      and isValidTacan helpers apply, shipped as the `tacan` index
      (tools/package/tables.py). Channels `first`..`last` in each of `bands`;
      the airborne interrogation is `interrogationMHz.base` + (channel -
      `first`) MHz in both bands; the ground reply is the interrogation plus
      the `replyOffsetMHz` of the channel's range; a channel of a
      `vhfPairing` range pairs with the VOR/ILS frequency `baseKHz` +
      (channel - `from`) * `stepKHz` + the band's `bandOffsetKHz`. Every
      beacon of `beaconTypes` with a `channel` of 1 or more must have its
      channel in the plan and, with a `frequencyHz`, a frequency equal to its
      channel's reply or paired VHF frequency in either band (DCS gives no
      X/Y mode), unless tacanPlanExceptions lists it; the build fails
      otherwise.
    evidence: >-
      ICAO Annex 10 Volume I, Chapter 3, Table A (DME channelling and
      pairing): channels 1X-126X and 1Y-126Y; interrogation 1025-1150 MHz in
      1 MHz steps; X replies 63 MHz below the interrogation on channels 1-63
      and above it on 64-126, Y replies the other way round; channels
      17X-59Y pair with 108.00-112.25 MHz and 70X-126Y with 112.30-117.95 MHz
      in 100 kHz steps, Y channels 50 kHz above X. DCS 2.9.29.27468 beacons
      match it: Caucasus TACAN frequencies are X replies (Batumi channel 16,
      977 MHz; Kobuleti 67, 1154 MHz), VORTAC and VOR/DME frequencies are the
      paired VHF frequencies (Nevada VORTAC LAS channel 116, 116.9 MHz;
      GermanyCW VOR/DME WRB channel 104, 115.75 MHz, a Y pairing).
    value:
      channels: {first: 1, last: 126}
      bands: [X, Y]
      interrogationMHz: {base: 1025}
      replyOffsetMHz:
        X: [{from: 1, to: 63, offset: -63}, {from: 64, to: 126, offset: 63}]
        Y: [{from: 1, to: 63, offset: 63}, {from: 64, to: 126, offset: -63}]
      vhfPairing:
        ranges: [{from: 17, to: 59, baseKHz: 108000}, {from: 70, to: 126, baseKHz: 112300}]
        stepKHz: 100
        bandOffsetKHz: {X: 0, Y: 50}
      beaconTypes:
        - BEACON_TYPE_TACAN
        - BEACON_TYPE_VORTAC
        - BEACON_TYPE_DME
        - BEACON_TYPE_VOR_DME
        - BEACON_TYPE_VOR
        - BEACON_TYPE_ILS_LOCALIZER
        - BEACON_TYPE_ILS_GLIDESLOPE

  - series: beacons
    table: tacanPlanExceptions
    note: >-
      Beacons (id -> why) whose DCS `frequencyHz` is neither the reply nor the
      paired VHF frequency of their `channel` in either band, so tacanPlan
      cannot reproduce them; tools/package/tables.py fails on any other
      mismatch and on an entry here that now matches or names no beacon.
      The package helpers compute frequencies from the channel and never read
      these values.
    evidence: >-
      The beacon records of the DCS 2.9.29.27468 extraction's beacons
      (Beacons.lua, verbatim): each frequency below against tacanPlan's reply
      and paired VHF frequencies for its channel, X and Y.
    value:
      Afghanistan.airfield17_1: "TACAN 65: 133.8 MHz; 65X/65Y reply 1152/1026 MHz, 65 is unpaired."
      Afghanistan.world_19: "DME 108: 334 MHz; 108X pairs with 116.10 MHz."
      Afghanistan.world_35: "VOR/DME 78: 113.0 MHz, the 77X pairing; 78X pairs with 113.10 MHz."
      Falklands.airfield6_4: "TACAN 31: 1 MHz; 31X reply 992 MHz, pairs with 109.40 MHz."
      GermanyCW.airfield11_1: "VORTAC 95: 110.0 MHz; 95X pairs with 114.80 MHz."
      GermanyCW.airfield155_0: "TACAN 24: 482 MHz; 24X reply 985 MHz, pairs with 108.70 MHz."
      GermanyCW.airfield158_0: "TACAN 48: 362.3 MHz; 48X reply 1009 MHz, pairs with 111.10 MHz."
      GermanyCW.airfield32_1: "TACAN 116: 114.85 MHz; 116X/116Y pair with 116.90/116.95 MHz."
      GermanyCW.airfield33_3: "VOR/DME 30: 112.0 MHz; 30X pairs with 109.30 MHz."
      GermanyCW.airfield41_18: "DME 32: 110.5 MHz; 32X pairs with 109.50 MHz."
      GermanyCW.airfield48_0: "VORTAC 77: 116.2 MHz; 77X pairs with 113.00 MHz."
      Iraq.airfield2_6: "TACAN 64: 121.7 MHz; 64X/64Y reply 1151/1025 MHz, 64 is unpaired."
      Kola.airfield25_3: "TACAN 67: 134.0 MHz; 67X/67Y reply 1154/1028 MHz, 67 is unpaired."
      PersianGulf.airfield1_0: "DME 101: 0.285 MHz; 101X pairs with 115.40 MHz."
      PersianGulf.airfield18_0: "TACAN 97: 122.5 MHz; 97X pairs with 115.00 MHz."
      PersianGulf.airfield20_0: "VOR/DME 119: 128.925 MHz; 119X pairs with 117.20 MHz."
      PersianGulf.airfield22_0: "DME 119: 114.25 MHz; 119X pairs with 117.20 MHz."
      PersianGulf.airfield23_0: "VOR 119: 114.0 MHz; 119X pairs with 117.20 MHz."
      PersianGulf.airfield25_0: "VOR/DME 119: 112.6 MHz; 119X pairs with 117.20 MHz."
      SinaiMap.airfield11_0: "TACAN 55: 113.7 MHz; 55X pairs with 111.80 MHz."
      SinaiMap.airfield23_0: "TACAN 87: 113.7 MHz; 87X pairs with 114.00 MHz."
      SinaiMap.airfield5_0: "VOR/DME 38: 115.65 MHz; 38X pairs with 110.10 MHz."

  - series: weapons
    table: seekerTypes
    note: >-
      Weapon `Head_Type` (seeker head type) code -> the name of the DCS engine
      constant carrying it, as `seekerTypeName`
      (tools/datamine/extract_stores.py), stamped hand-authored. Neither the
      _G dump's constants nor any install script defines these as Lua values.
    evidence: >-
      DCS 2.9.29.27468 CoreMods/aircraft/AJS37/Entry/Weapons.lua lines 3-11
      quote the engine's seeker-head enum ("-- Headtypes ... const int
      InfraredSeeker = 1; ActiveRadar = 2; AntiRadar = 3; LaserHoming = 4;
      Autopilot = 5; SemiActiveRadar = 6; SemiAutoAT = 7"), repeated at line
      3353 ("Seaker" type: InfraredSeeker = 1; ... SemiAutoAT = 7). Weak: a
      Lua comment quoting C++ constants, not a runtime value.
      Consistent with the data: 1 on AIM-9/R-73/Igla/Stinger, 2 on
      AIM-120/AIM-54/R-77, 3 on AGM-88/AGM-45/Kh-25MP, 4 on laser weapons
      (AGM-114K, APKWS, Kh-29L), 6 on AIM-7/R-27R/SA-6/Patriot, 7 on
      command-guided ATGMs (Ataka, HOT, AGM-12).
    value:
      1: InfraredSeeker
      2: ActiveRadar
      3: AntiRadar
      4: LaserHoming
      5: Autopilot
      6: SemiActiveRadar
      7: SemiAutoAT

  - series: countries
    table: aliases
    note: >-
      Country `idName` -> other names it goes by, for the package's countryId
      helper (shipped as the `countryAliases` index by
      tools/package/tables.py). An alias equal to any country's name,
      shortName, internationalName, idName or oldId (ASCII case-insensitive,
      trimmed), shared by two countries, or for an idName the data lacks
      fails the build.
    evidence: >-
      ISO 3166-1 English short names where DCS 2.9.29.27468 db.Countries
      names differ: United States of America (DCS USA), United Kingdom of
      Great Britain and Northern Ireland (DCS UK), Netherlands (DCS The
      Netherlands), Czechia (DCS Czech Republic, renamed in ISO 3166 in 2016);
      "United States" and "United Kingdom" are their common short forms.
    value:
      USA: [United States, United States of America]
      UK: [United Kingdom, Great Britain]
      THE_NETHERLANDS: [Netherlands]
      CHEZH_REPUBLIC: [Czechia]

  - series: countries
    table: allLiveries
    note: >-
      Country `shortName`s the mission editor offers every livery of a unit
      type, whatever the livery's `countries`: the package's liveriesFor
      helper returns all of a unit's liveries for them (shipped as the
      `allLiveryCountries` index, country id -> shortName, by
      tools/package/tables.py).
      A shortName no country has, or two countries share, fails the build.
    evidence: >-
      DCS 2.9.29.27468 MissionEditor/modules/loadLiveries.lua lines 23-29
      (loadSchemes): "--[DCSCORE-5294: Allow all liveries to be availiable to
      Joint task force red and blue]" then, when countryShortName is "BLUE"
      or "RED", sets countryShortName = nil, which line 19 documents as "nil
      (all countries)" for DCS.getObjectLiveriesNames (line 31). db.Countries
      gives shortName BLUE to Combined Joint Task Forces Blue (id 80) and RED
      to Combined Joint Task Forces Red (id 81).
    value: [BLUE, RED]

  - series: units
    table: classes
    note: >-
      Ordered rules giving a unit one class (the package helpers' unitClass;
      tools/package/rules.py ships them in the `classification` index). A rule
      matches when each fact it names holds: `any` (at least one of),
      `all` (every one of) and `none` (none of) the listed values. Facts:
      `series` (the unit's series), `attributes` (its DCS attributes) and
      `kind` (an aircraft's `kind`). The first matching rule wins; a unit no
      rule matches is `other`. A rule that matches no unit, or names an
      attribute, series or kind the data lacks, fails `task package`.
    evidence: >-
      DCS's own unit categories and attributes (DCS 2.9.29.27468
      _G/db/Units and the attribute tree of Scripts/Database/db_attributes.lua):
      the series is the db/Units category; `Aircraft Carriers`, `Submarines`,
      `EWR`, the `SAM *`/`MANPADS*`/`IR Guided SAM`/`AA_missile` air defence
      attributes, `AAA`/`AA_flak`/`Static AAA`/`Mobile AAA`, `Artillery`/`MLRS`/
      `Indirect fire`/`SS_missile`, `Tanks`, `IFV`, `APC`/`Infantry carriers`,
      `Infantry`, `RailwayUnits`, `Fortifications`, the `PRMG_*`/`RSBN` beacon
      attributes, `Trucks`/`Trailers` and `Cars` are DCS attribute names. The
      order puts the more specific class first (an S-300 launcher is also
      `Armed vehicles`; a MANPADS soldier is also `Infantry`). DCS gives
      radar-directed guns the SAM attributes of their radar (ZSU-23-4,
      Gepard and M163 carry `SAM TR`/`SAM elements`), so a gun unit is `aaa`
      unless it also fires missiles (`AA_missile`, `SAM LL`, `IR Guided SAM`,
      `MANPADS`: the 2S6 Tunguska is `sam`).
    value:
      - class: carrier
        when: {attributes: {any: [Aircraft Carriers]}}
      - class: submarine
        when: {attributes: {any: [Submarines]}}
      - class: ship
        when: {series: {any: [ships]}}
      - class: helicopter
        when: {series: {any: [aircraft]}, kind: {any: [rotary]}}
      - class: airplane
        when: {series: {any: [aircraft]}}
      - class: personnel
        when: {series: {any: [personnel]}}
      - class: structure
        when: {series: {any: [structures]}}
      - class: ewr
        when: {attributes: {any: [EWR]}}
      - class: aaa
