      runs both).
    evidence: >-
      dcs-world-schema/types/tasks/{AttackMapObject,Bombing,CarpetBombing,
      fireAtPoint,land,orbit,Strafing}.record.yaml and
      enrouteTasks/EngageTargetsInZone.record.yaml at 7747097d; the first
      actions probe (2.9.29.27468/api/actions-probe.json) accepted steps
      giving both forms.

  - series: actions
