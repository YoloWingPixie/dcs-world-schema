  - series: probe
    table: contextSamples
    note: >-
      Argument values the probe tries before its plain samples ("probe" for a
      string, 1 for a number), for arguments that name something: the
      functions of `paths` (as in doNotCall: `*` matches any text; `envs`
      limits a rule to those envs) get, at argument `position` (default 1),
      the first entry of `pool`, from the probe mission: groups, units,
      statics (static unit names), zones, airbases (the sides' airbases,
      FARPs and ships), drawings, flags, unitTypes, staticTypes (strings);
      sides, countries (numbers; blue first). The first matching rule wins;
      when the call then fails with an error that names no argument, the
      plain sample is tried in its place.
    evidence: >-
      Parameter names and types of the hand-written mission scripting schema
      (dcs-world-schema/globals: Group.getByName, Unit.getByName,
      StaticObject.getByName, Airbase.getByName, Warehouse.getByName `name`;
      Unit/StaticObject.getDescByName `typeName`; trigger.misc.getZone
      `zoneName`; trigger.misc.getUserFlag, trigger.action.setUserFlag
      `flagNameOrId`; trigger.action.ctfColorTag, setUnitInternalCargo
      `unitName`; coalition.* `coalition.side` / `country.id`) and the
      2.9.29.27468 probe run's messages ("Parameter #1 (group name) missed"
      from forceAttackGroup, "Parameter #2 (country id) missed" from
      coalition.getCountryCoalition).
    value:
      - {paths: [Group.getByName, forceAttackGroup, coalition.remove_dyn_group], pool: groups}
      - {paths: [Unit.getByName, trigger.action.ctfColorTag, trigger.action.setUnitInternalCargo], pool: units}
      - {paths: [StaticObject.getByName], pool: statics}
      - {paths: [Airbase.getByName, Warehouse.getByName], pool: airbases}
      - {paths: [trigger.misc.getZone], pool: zones}
      - {paths: [trigger.misc.getUserFlag, trigger.action.setUserFlag], pool: flags}
      - {paths: [Unit.getDescByName], pool: unitTypes}
      - {paths: [StaticObject.getDescByName], pool: staticTypes}
      - {paths: [coalition.getCountryCoalition, trigger.action.outTextForCountry, trigger.action.outSoundForCountry], pool: countries}
      - {paths: [coalition.getCountryCoalition], position: 2, pool: countries}
      - {paths: ["coalition.get*", coalition.checkChooseCargo, coalition.checkDescent, trigger.action.outTextForCoalition, trigger.action.outSoundForCoalition], pool: sides}

  - series: probe
    table: actions
    note: >-
      The live AI actions probe (tools/datamine/actions_probe.py,
      hook/actions-probe.lua, hook/actions-probe-lib.lua). `samples`: per
      group category the probe/mission object whose blue group's controller
      takes that category's calls. `route`: where the late-activated route
      groups of a category spawn (an [x, y] m offset from the blue side's
      `anchor`); only one is active at a time. `effects`: ids whose steps also
      measure a behaviour change against a control step with the same params
      (`object` replaces the category's sample; `params` are merged over the
      Mission Editor's defaults and may use the placeholders $target,
      $target.x, $target.y, $alt, $speed). `measures`: turnToward (target
      `distance` m at `bearing` degrees from the lead unit's velocity, negative
      to the left; observed when the end angle to it is at most `maxEndAngle`
      and the control's is more), stop (observed when the end ground speed is
      at most `maxEndSpeed` and the control's more; route groups drive at
      `routeSpeed` m/s), shoot (target `distance` m ahead; observed with at
      least `minShots` shots and the control fewer). `deny`: `kind:dcsId`
      patterns never called, with a reason.
    evidence: >-
      Samples and anchors are the probe/mission objects (PROBE_PLANE F-15C at
      3000 m, PROBE_HELO UH-60A at 300 m, PROBE_GROUND M-1 Abrams,
      PROBE_ARTY 2B11 mortar, PROBE_SHIP PERRY). Offsets keep route groups
      clear of the samples and of the land/sea boundary of Caucasus (the
      blue land anchor is Kutaisi, the sea anchor 40-45 km off the coast).
      Orbit, Land, Hold and FireAtPoint: MissionEditor/modules/me_action_db.lua
      writes FireAtPoint and Land targets as x/y and orbits at the waypoint;
      the hand-written schema uses `point`, so both are given. A 2B11 mortar
      reaches 2 km. No action is known to be destructive: tasks only change
      what the probe mission's immortal, invisible samples do.
    value:
      samples: {plane: PROBE_PLANE, helicopter: PROBE_HELO, vehicle: PROBE_GROUND, ship: PROBE_SHIP}
      route:
        plane: {anchor: land, offset: [30000, 0]}
        helicopter: {anchor: land, offset: [10000, -10000]}
        vehicle: {anchor: land, offset: [4000, 4000]}
        ship: {anchor: sea, offset: [0, 20000]}
      effects:
        - {dcsId: Orbit, categories: [plane, helicopter], measure: turnToward, seconds: 30, params: {pattern: Circle, point: $target, x: $target.x, y: $target.y, altitude: $alt, speed: $speed}}
        - {dcsId: Land, categories: [helicopter], measure: turnToward, seconds: 30, params: {point: $target, x: $target.x, y: $target.y}}
        - {dcsId: Hold, categories: [vehicle], measure: stop, seconds: 20}
        - {dcsId: FireAtPoint, categories: [vehicle], object: PROBE_ARTY, measure: shoot, seconds: 30, params: {point: $target, x: $target.x, y: $target.y, expendQty: 1, expendQtyEnabled: true}}
      measures:
        turnToward: {distance: 10000, bearing: -90, maxEndAngle: 45}
        stop: {maxEndSpeed: 0.5, routeSpeed: 10}
        shoot: {distance: 2000, bearing: 0, minShots: 1}
      deny: []

  - series: probe
    table: actionsFollowup
    note: >-
      The actions probe's follow-up (tools/datamine/actions_probe.py
      `followup_plan`, hook/actions-probe-followup-lib.lua): open questions of
      the first run. Samples, route places and measures are probe/actions'.
      `cases`: one AI action (`kind`, `dcsId`; params over the Mission
      Editor's defaults of that id, when it has one) per `categories` and
      `contexts`, once per `variants` entry (its params merged last, after the
      keys of every variant are dropped), plus a control (ActionsProbeNoSuchId, first variant's params); with a
      `measure` (probe/actions `measures`) over `seconds`, every API-context
      step runs on a fresh late-activated copy of the sample (`object`
      replaces it) flying or driving straight, activated at reset and
      destroyed after. `compare`: other ids run like a variant (labelled) in
      the listed contexts, judged against the same control. Placeholders
      without a measure resolve to the group's own position. A measured case
      may also give `at` (where its spawned and route groups start, as a
      probe/actions `route` entry), `leg` (metres flown or driven straight
      ahead, over the measure's) and `target`: an object whose group fixes
      the effect target ($target; its first side's place), and whose hits by
      the step's group a `shoot` step counts next to its shots (`hits`, not
      judged). `objects`: probe/mission objects added to the follow-up's
      mission, with `sides` (placed for these only), `anchorSide` (whose
      anchors), `pylons` (aircraft: station -> CLSID) and `immortal`
      (vehicles); an aircraft that `fires` gets probe/mission `roe.fires`, so it attacks
      only what it is tasked with. `options`: setOption calls of each option
      with every Mission Editor value of the category and its
      `missionValues` most frequent install mission values (no value when
      there is none).
    evidence: >-
      Ids and params: the first run (DCS 2.9.29.27468
      api/actions-probe.json, plan 311bdd7d22614797) took only
      DCS casing; its point/x/y steps passed both forms, so which DCS reads
      is open. StopRoute: Scripts/ScriptingSystem.lua
      trigger.action.groupStopMoving/groupContinueMoving send
      setCommand({id = 'StopRoute', params = {value = true|false}}); the
      former hand-written CommandId had stopRoute. A WrappedAction replaces
      the route task, so SetInvisible (inert on the invisible samples) shows
      whether any wrapped command stops a vehicle. Option values: the options
      series (FORMATION: Mission Editor values 1-18, missions mostly packed
      values such as 131074; RADIO_USAGE_*: missions strings such as
      "none;"). Bombing and EngageTargetsInZone: the first run's F-15C sample
      carried no air-to-ground stores and had no target, so its steps showed
      acceptance only. PROBE_BOMBER is the stock AI F-15E (module null in
      DCS 2.9.29.27468 aircraft/F-15E.json), whose
      stations 4-6 and 14-16 accept {Mk82AIR}
      (stores/{Mk82AIR}.json); a bomb release is an S_EVENT_SHOT. PROBE_TARGET
      is a red T-72B (PROBE_GROUND's red type), immortal so every step finds
      it, at the Bombing point and the centre of the EngageTargetsInZone zone
      (zoneRadius 5000 by default). Both lie in the Colchis lowland west of
      Kutaisi (between Kutaisi, elevation 45 m, and Senaki-Kolkhi, 13 m, in
      airbases/Caucasus), the bomber starting 12 km south of the target and
      heading north over it, clear of the other probe groups.
    value:
      objects:
        - {name: PROBE_BOMBER, kind: plane, sides: [blue], anchor: land, offset: [-8000, 6000], alt: 3000, type: F-15E, fuel: internal, speed: optimal, fires: true, pylons: {4: "{Mk82AIR}", 5: "{Mk82AIR}", 6: "{Mk82AIR}", 14: "{Mk82AIR}", 15: "{Mk82AIR}", 16: "{Mk82AIR}"}}
        - {name: PROBE_TARGET, kind: vehicle, sides: [red], anchorSide: blue, anchor: land, offset: [-2000, -23000], type: T-72B, immortal: true}
      cases:
        - kind: task
          dcsId: Orbit
          categories: [plane, helicopter]
          contexts: [setTask, route]
          measure: turnToward
          seconds: 30
          params: {pattern: Circle, altitude: $alt, speed: $speed}
          variants: &pointVariants
            both: {point: $target, x: $target.x, y: $target.y}
            point: {point: $target}
            xy: {x: $target.x, y: $target.y}
            none: {}
        - {kind: task, dcsId: Land, categories: [helicopter], contexts: [setTask, route], measure: turnToward, seconds: 30, variants: *pointVariants}
        - kind: task
          dcsId: Bombing
          categories: [plane]
          object: PROBE_BOMBER
          contexts: [setTask, route]
          measure: shoot
          seconds: 120
          target: PROBE_TARGET
          at: &bomberStart {anchor: land, offset: [-14000, -23000]}
          leg: 30000
          variants: *pointVariants
        - {kind: task, dcsId: FireAtPoint, categories: [vehicle], object: PROBE_ARTY, contexts: [setTask, route], measure: shoot, seconds: 30, params: {expendQty: 1, expendQtyEnabled: true}, variants: *pointVariants}
        - kind: enrouteTask
          dcsId: EngageTargetsInZone
          categories: [plane]
          object: PROBE_BOMBER
          contexts: [pushTask, route]
          measure: shoot
          seconds: 150
          target: PROBE_TARGET
          at: *bomberStart
          leg: 30000
          variants: *pointVariants
        - kind: command
          dcsId: StopRoute
          categories: [vehicle]
          contexts: [setCommand, wrappedAction, route]
          measure: stop
          seconds: 20
          params: {value: true}
          compare:
            - {id: SetInvisible, label: inert, params: {value: true}, contexts: [wrappedAction]}
      options:
        ids: [FORMATION, NO_OPTION, RADIO_USAGE_CONTACT, RADIO_USAGE_ENGAGE, RADIO_USAGE_KILL]
        missionValues: 3

  - series: actions
    table: descriptions
    note: >-
      Hand-written descriptions of the AI task, en-route task and command
      types generated from the actions series (tools/datamine/action_types.py,
      dcs-world-schema/types/ai/*.generated.yaml), moved from the former
      hand-written Task*/TaskEnRoute*/Command* records. Text only: the
      types' ids and parameters are the actions series' (with the parameters
      the record patches above add). Keyed by kind and DCS id: `description`
      of the type, `params` of its parameters (text, or `{type,
      description}` to name a schema type for one). An id or parameter the
      series lacks is an error. Ids the former records had only in another
      casing are listed under DCS's. `param` types a parameter name in every
      action that has it (without its own type): a scripting API enum,
      widened by the Mission Editor's own values (`expend` `"Auto"`,
      `pattern` `"Anchored"`, `designation` `"WP+Laser"`), or a `DcsId`
      type (open: `| string`, `| number`) where mods add ids.
    evidence: >-
      dcs-world-schema/types/tasks/*.record.yaml, enrouteTasks/*.record.yaml
      and commands/*.record.yaml at 7747097d, matched to the Mission Editor
      ids of DCS 2.9.29.27468 (MissionEditor/modules/me_action_db.lua)
      ignoring case. DisembarkFromTransport matches no Mission Editor id
      and the live actions probe (api/actions-probe.json) shows setTask
      rejects it ("Unknown task"), so it is dropped. stopRoute matches none
      either; Scripts/ScriptingSystem.lua sends id 'StopRoute' with
      setCommand, so it is kept as StopRoute (an actions series record of
      DCS's scripts).
      `param` types: the string values install missions write (the actions
      series' missionStrings) against AI.Task.WeaponExpend, OrbitPattern and
      Designation of api/scripting.json; the Mission Editor writes "Auto"
      (expend, 4406 uses), "Anchored" (Orbit pattern, 6) and "WP+Laser"
      (designation, 12), which those tables lack. Install missions also
      write: modeChannel "X"/"Y" (1782); attackType "Dive" and "Carpet"
      (me_action_db.lua defaults add "Toss"); weaponType sums of
      Weapon.flag bits (1073741822, 9663676414) beside its members;
      modulation 0/1; selectedType unit types of helicopters and ground
      vehicles (KrAZ6322, LAV-25); formationType 15 (a db.FormationID);
      targetTypes/noTargetTypes unit attributes plus five missile ones
      (DcsId.Attribute). formation (Escort, Follow) is in no install
      mission, so its type stays open.
    value:
      command:
        ActivateACLS:
          description: Command that activates an Automatic Carrier Landing System
            (ACLS) on an aircraft carrier.
          params:
            name: Name of the ACLS (label only).
            unitId: ID of the ship unit that will provide the ACLS functionality (requires carrier with appropriate
              systems).
        ActivateBeacon:
          description: Command that activates a radio navigation beacon on a unit
            or group.
          params:
            callsign: Morse code identifier transmitted by the beacon for identification.
            frequency: Broadcast frequency in Hertz for the navigation beacon.
            name: Descriptive name for the beacon shown in the mission editor interface.
            system:
              type: BeaconSystemName
              description: Navigation system that will process the beacon signal.
            type:
              type: BeaconType
              description: Beacon type identifier determining its functional characteristics.
        ActivateICLS:
          description: Command that activates an Instrument Carrier Landing System
            (ICLS) beacon for aircraft carriers.
          params:
            channel: ICLS channel number (1-20) that aircraft will tune to for landing guidance.
            name: Name of the ICLS beacon (label only).
            type:
              type: BeaconType
              description: Fixed value of 131584 identifying an ICLS beacon type.
            unitId: ID of the ship unit that will broadcast the ICLS beacon signal.
        ActivateLink4:
          description: Command that activates a Link 4 data link system for aircraft
            carrier operations.
          params:
            frequency: Operating frequency in Hertz for the data link communications.
            name: Name of the Link 4 system (label only).
            unitId: ID of the ship unit that will broadcast the Link 4 signal (must have Link 4 capability).
        DeactivateACLS:
          description: Command that deactivates any active Automatic Carrier Landing
            System (ACLS) on a unit or group.
        DeactivateBeacon:
          description: Command that deactivates any active radio navigation beacon
            on a unit or group.
        DeactivateICLS:
          description: Command that deactivates any active Instrument Carrier Landing
            System (ICLS) beacon on a unit or group.
        DeactivateLink4:
          description: Command that deactivates any active Link 4 data link system
            on a unit or group.
        EPLRS:
          description: Command that toggles the Enhanced Position Location Reporting
            System (EPLRS) data link capabilities for a unit or group.
          params:
            groupId: Track number assigned to the first unit in the group (only relevant for ground vehicle
              groups).
            value: EPLRS state where true activates the data link, false deactivates it.
        LoadingShip:
          description: Command that adjusts a ship's cargo loading level, affecting
            its buoyancy and water line position.
          params:
            cargo: Cargo load percentage (0-100) determining how much the ship sits in water (lower values raise
              the waterline).
            unitId: ID of the ship unit whose cargo load level will be modified.
        SMOKE_ON_OFF:
          description: Command that toggles aircraft smoke pod emission.
          params:
            value: Smoke state where true activates smoke emission, false deactivates it.
        Script:
          description: Command that executes a Lua script within the context of a
            group, providing access to the group through the '...' self-reference.
          params:
            command: Lua code string to be executed within the group's context.
        SetCallsign:
          description: Command that changes a group's identification callsign for
            radio communications.
          params:
            callname: Callsign name identifier (varies by unit type; 1-19 for JTAC units per Callsigns_JTAC
              enum).
            number: Numeric suffix for the callsign (1-9), used to distinguish between units with the same callname.
        SetFrequency:
          description: Command that changes the radio broadcasting frequency for
            an AI group.
          params:
            frequency: 'Radio frequency in Hertz (note: mission editor displays MHz, multiply by 1,000,000 to
              convert).'
            modulation: Radio modulation type (0 = AM, 1 = FM).
            power: Radio transmit power in watts, determining broadcast range.
        SetFrequencyForUnit:
          description: Command that changes the radio broadcasting frequency for
            a specific unit within an AI group.
          params:
            frequency: 'Radio frequency in Hertz (note: mission editor displays MHz, multiply by 1,000,000 to
              convert).'
            modulation: Radio modulation type (0 = AM, 1 = FM).
            power: Radio transmit power in watts, determining broadcast range.
            unitId: ID of the specific unit within the group whose radio frequency will be modified.
        SetImmortal:
          description: Command that toggles a group's invulnerability to all damage.
          params:
            value: Immortality state where true makes the group immune to all damage, false restores normal
              vulnerability.
        SetInvisible:
          description: Command that toggles a group's visibility to enemy AI sensors.
          params:
            value: Invisibility state where true makes the group undetectable by enemy AI, false restores normal
              detection.
        SetUnlimitedFuel:
          description: Command that toggles infinite fuel supply for a unit or group.
          params:
            value: Fuel state where true prevents fuel depletion during operation, false restores normal fuel
              consumption.
        Start:
          description: Command that activates an initially inactive group, triggering
            AI units to follow their designated route.
        StopRoute:
          description: Halts or resumes a group's movement along its route.
          params:
            value: true halts the group in place, false resumes its route.
        StopTransmission:
          description: Command that terminates any active radio message transmission
            from a unit or group.
        SwitchAction:
          description: Command that changes the active task action within a mission
            group's task queue.
          params:
            actionIndex: Index of the target action in the group's task queue to make active.
        SwitchWaypoint:
          description: Command that changes the active route leg for a group, allowing
            control of navigation between waypoints.
          params:
            fromWaypointIndex: Index of the waypoint where the group will begin its new route leg.
            goToWaypointIndex: Index of the destination waypoint the group will navigate toward.
        TransmitMessage:
          description: Command that broadcasts an audio message over a unit or group's
            active radio frequency.
          params:
            duration: Display time in seconds for the message subtitles (ignored when loop is true).
            file: Path to the sound file that will be played as the radio transmission.
            loop: Transmission mode where true causes the message to repeat continuously until stopped.
            subtitle: Text displayed in the radio message queue representing the transmission content.
      enrouteTask:
        AWACS:
          description: En-route task that assigns the aircraft
            to act as an AWACS for friendly forces.
        EWR:
          description: En-route task that assigns the group
            to act as an EWR radar for friendly forces.
        EngageGroup:
          description: En-route task that assigns the controlled
            group to search for and engage a specific group. The target must be detected for AI to engage it.
          params:
            groupId: Unique identifier for the target group.
            priority: 'The priority of the tasking, where lower numbers indicate higher importance (default:
              0).'
            weaponType: Defines the preferred weapon type to engage the enemy.
            attackQty: Number of times the group will attack if the target is still alive and AI still have ammo.
            attackQtyLimit: Determines if the attack quantity limit is enabled.
            direction: Defines the direction from which the flight will engage from (in radians).
            expend: Defines how many munitions the AI will expend per attack run (QUARTER, TWO, ONE, FOUR, HALF, ALL).
        EngageTargets:
          description: En-route task that assigns the controlled
            group to engage targets matching specific parameters.
          params:
            maxDist: Maximum distance to search for targets in meters.
            maxDistEnabled: Whether to use the maxDist parameter.
            priority: Priority of the task, where lower numbers indicate higher importance.
            targetTypes: Table of target categories to engage.
            value: The value of the task.
            maxAlt: Maximum altitude for targets in meters.
            maxAltEnabled: Whether to use the maxAlt parameter.
            minAlt: Minimum altitude for targets in meters.
            minAltEnabled: Whether to use the minAlt parameter.
        EngageTargetsInZone:
          description: En-route task that assigns the controlled
            group to engage targets with specific attributes within a defined zone.
          params:
            priority: 'The priority of the tasking, where lower numbers indicate higher importance (default:
              0).'
            targetTypes: Table of attribute names that define valid targets.
            zoneRadius: Radius in meters defining the size of the area the group will engage targets within.
            point:
              type: Vec2
              description: A `Vec2` point defining the center of the area the group will engage targets within in the DCS World coordinate system.
        EngageUnit:
          description: En-route task that assigns the controlled
            group to search for and engage a specific unit. The target must be detected for AI to engage it.
          params:
            attackQty: Number of times the group will attack if the target is still alive and AI still have
              ammo.
            attackQtyLimit: Determines if the attack quantity limit is enabled.
            direction: Defines the direction from which the flight will engage from (in radians).
            expend: Defines how many munitions the AI will expend per attack run (QUARTER, TWO, ONE, FOUR, HALF,
              ALL).
            groupAttack: If true, each aircraft in the group will attack the unit.
            priority: 'The priority of the tasking, where lower numbers indicate higher importance (default:
              0).'
            unitId: Unique identifier of the target unit.
            weaponType: Defines the preferred weapon type to engage the enemy.
        FAC:
          description: En-route task that assigns the controlled
            group to act as a Forward Air Controller or JTAC. Any detected targets will be assigned as targets
            to the player via the JTAC radio menu.
          params:
            callname:
              type: Callsigns_JTAC
              description: JTAC callsign identifier (Axeman, Darknight, etc.).
            frequency: Radio frequency to use for the JTAC communications.
            modulation: Radio modulation type for JTAC communications.
            number: JTAC callsign number.
            priority: 'The priority of the tasking, where lower numbers indicate higher importance (default: 0).'
        FAC_EngageGroup:
          description: En-route task that assigns the controlled
            group to act as a Forward Air Controller or JTAC and engage the specified group as a JTAC target
            once detected.
          params:
            callname:
              type: Callsigns_JTAC
              description: JTAC callsign identifier (Axeman, Darknight, etc.).
            datalink: Determines whether the JTAC will send the 9-line via SADL, enabled by default.
            designation: Type of designation to be used (NO, WP, IR_POINTER, LASER, AUTO).
            frequency: Radio frequency to use for the JTAC communications.
            groupId: ID of the group that is to be assigned by JTAC.
            modulation: Radio modulation type for JTAC communications.
            number: JTAC callsign number.
            priority: 'The priority of the tasking, where lower numbers indicate higher importance (default:
              0).'
            weaponType: Weapon flag type that defines the preferred weapon of choice.
        Tanker:
          description: En-route task that assigns the aircraft
            to act as an airborne tanker for friendly forces. The aircraft must be a certified tanker aircraft.
      param:
        attackType: '"Dive" | "Carpet" | "Toss" | string'
        callname: number
        designation: AI.Task.Designation | "WP+Laser"
        expend: AI.Task.WeaponExpend | "Auto"
        formation: DcsId.FormationValue | number
        formationType: DcsId.FormationId | number
        modeChannel: '"X" | "Y"'
        modulation: radio.modulation
        noTargetTypes: (DcsId.Attribute | string)[]
        pattern: AI.Task.OrbitPattern | "Anchored"
        selectedType: DcsId.UnitType | string
        targetTypes: (DcsId.Attribute | string)[]
        weaponType: Weapon.flag | number
      task:
        AttackGroup:
          description: Attack task that directs a group
            to engage another group.
          params:
            altitude: Attack altitude in meters.
            altitudeEnabled: Determines whether to use the specified altitude for attack.
            attackQty: Number of attack passes the group will perform on the target.
            attackQtyLimit: Determines whether to use the attackQty parameter as a limit.
            direction: Attack direction in radians, defining the approach vector.
            directionEnabled: Determines whether to use the specified direction for attack.
            expend: Quantity of weapons to expend during the attack (QUARTER, TWO, ONE, FOUR, HALF, ALL).
            groupId: Unique ID of the group to attack.
            weaponType: Weapon flag type to use for the attack.
        AttackMapObject:
          description: Assigns the nearest world object to the point for AI to attack.
          params:
            attackQty: Number of times the group will attack if the target
            attackQtyLimit: If true the attackQty value will be followed
            direction: Attack direction in radians
            expend: Quantity of weapons to expend (QUARTER, TWO, ONE, FOUR, HALF, ALL)
            groupAttack: If true then each aircraft in the group will attack the target
            weaponType: Weapon flag type to use for the attack
            x: X coordinate of the target (alternative to point)
            y: Y coordinate of the target (alternative to point)
            point:
              type: Vec2
              description: Vec2 coordinate of the target point
        AttackUnit:
          description: Attack task that directs a group
            to engage a specific unit.
          params:
            attackQty: Number of attack passes the group will perform on the target.
            attackQtyLimit: Determines whether to use the attackQty parameter as a limit.
            direction: Attack direction in radians, defining the approach vector.
            expend: Quantity of weapons to expend during the attack (QUARTER, TWO, ONE, FOUR, HALF, ALL).
            groupAttack: Determines whether each aircraft in the group will attack individually (true) or as
              a coordinated unit (false).
            unitId: Unique ID of the unit to attack.
            weaponType: Weapon flag type to use for the attack.
        Bombing:
          description: Assigns a point on the ground for which the AI will attack. Best used for discriminant
            carpet bombing of a target or having a GBU hit a specific point on the map.
          params:
            altitude: Altitude in meters for the attack
            altitudeEnabled: Whether to use the altitude parameter
            attackQty: Number of times the group will attack the target
            attackQtyLimit: Whether to use the attackQty parameter
            attackType: Attack profile to use (e.g. 'Dive' for dive bombing)
            direction: Attack direction in radians
            expend: Quantity of weapons to expend (QUARTER, TWO, ONE, FOUR, HALF, ALL)
            groupAttack: If true then each aircraft in the group will attack the point
            weaponType: Weapon flag type to use for the attack
            x: X coordinate of the target (alternative to point)
            y: Y coordinate of the target (alternative to point)
            point:
              type: Vec2
              description: Vec2 coordinate of the target
        BombingRunway:
          description: Assigns the AI a task to bomb an airbases runway. By default the AI will line up along
            the length of the runway and drop its payload.
          params:
            attackQty: Number of times the group will attack the target
            attackQtyLimit: Whether to use the attackQty parameter
            direction: If provided the AI will attack from this azimuth and ignore bombing along the length
              of the runway
            expend: Quantity of weapons to expend (QUARTER, TWO, ONE, FOUR, HALF, ALL)
            groupAttack: If true then each aircraft in the group will attack the runway
            runwayId: Index of the airbase for which is to be bombed
            weaponType: Weapon flag type to use for the attack
        CarpetBombing:
          description: Assigns a point on the ground for which the AI will attack. Similar to the bombing task,
            but with more control over target area. Can be combined with follow big formation task for all participating
            aircraft to simultaneously bomb a target.
          params:
            altitude: Altitude in meters for the attack
            altitudeEnabled: Whether to use the altitude parameter
            attackQty: Number of times the group will attack the target
            attackQtyLimit: Whether to use the attackQty parameter
            attackType: Type of attack, typically 'Carpet'
            carpetLength: Distance in meters the pattern should cover
            expend: Quantity of weapons to expend (QUARTER, TWO, ONE, FOUR, HALF, ALL)
            groupAttack: If true then each aircraft in the group will attack the point
            weaponType: Weapon flag type to use for the attack
            x: X coordinate of the target (alternative to point)
            y: Y coordinate of the target (alternative to point)
            point:
              type: Vec2
              description: Vec2 coordinate of the target
        Escort:
          description: Controlled aircraft will follow the assigned group along their route in formation and
            will engage threats within a defined distance from the followed group.
          params:
            engagementDistMax: Maximum distance of targets from the followed aircraft that the AI will actively
              engage
            groupId: Unique ID of the group to escort
            lastWptIndex: 'Identifies the waypoint at which the following group will stop its task (default:
              -1)'
            lastWptIndexFlag: 'If true the AI will follow the group until it reaches a specified waypoint (default:
              true)'
            pos: Vec3 point defining the relative position the controlled flight will form up on
            targetTypes: Array of attribute types which the AI will engage
            formation: Formation number, as the FORMATION option takes (DcsTask.OptionValue.FORMATION_*).
        FAC_AttackGroup:
          description: Assigns the controlled group to act as a Forward Air Controller or JTAC in attacking
            the specified group. This task adds the group to the JTAC radio menu and interacts with a player
            to destroy the target.
          params:
            callname:
              type: Callsigns_JTAC
              description: JTAC callsign identifier (Axeman, Darknight, etc.)
            datalink: Determines whether or not the JTAC will send the 9-line via SADL, enabled by default
            designation: Type of designation to be used (NO, WP, IR_POINTER, LASER, AUTO)
            frequency: Radio frequency to use for the JTAC
            groupId: ID of the group that is to be assigned by JTAC
            modulation: Radio modulation type
            number: JTAC callsign number
            weaponType: Weapon flag type that defines the preferred weapon of choice
        FireAtPoint:
          description: Assigns a point on the ground for which the AI will shoot at. Most commonly used with
            artillery to shell a target.
          params:
            alt_type: Determines if the altitude is defined by AGL (1) or MSL (0)
            altitude: If present the task will be focused on shooting at the specified altitude for the point
            counterbattaryRadius: The radius in meters from the group leader that the group will move in random
              directions after completing the fireAtPoint task
            expendQty: Specifies number of shots to be fired
            expendQtyEnabled: Whether or not expendQty will be used
            weaponType: Weapon flag type to use for the attack
            x: X coordinate of the target (alternative to point)
            y: Y coordinate of the target (alternative to point)
            point:
              type: Vec2
              description: Vec2 coordinate to define where the AI will aim
            radius: Optional radius in meters that defines the area AI will attempt to hit
        Follow:
          description: Follow task that directs aircraft
            to join formation with another group or orbit above ground units.
          params:
            groupId: Unique ID of the group to follow or orbit above if it's a ground unit.
            lastWptIndex: Waypoint index of the lead group that, when reached, will cause the following aircraft
              to terminate the task.
            lastWptIndexFlag: Determines whether the AI will terminate the follow task when the lead group reaches
              a specified waypoint.
            pos: A `Vec3` representing the relative position the controlled flight will maintain within the
              formation in the DCS World coordinate system.
            formation: Formation number, as the FORMATION option takes (DcsTask.OptionValue.FORMATION_*).
        FollowBigFormation:
          description: Advanced formation-following task
            for coordinated bombing missions with multiple aircraft.
          params:
            groupId: Unique ID of the lead aircraft group to follow.
            lastWptIndex: Waypoint index of the lead group that, when reached, will cause the following aircraft
              to terminate the task.
            lastWptIndexFlag: Determines whether the AI will terminate the follow task when the lead group reaches
              a specified waypoint.
            pos: A `Vec3` representing the relative position the controlled flight will maintain within the
              formation in the DCS World coordinate system.
            formation: Formation number, as the FORMATION option takes (DcsTask.OptionValue.FORMATION_*).
        GroundEscort:
          description: Ground escort task that directs helicopters
            to provide aerial protection for ground units.
          params:
            engagementDistMax: Maximum distance in meters defining the size/length of the orbit pattern before
              the helicopter returns to the escorted group.
            groupId: Unique ID of the ground group to escort and protect.
            lastWptIndex: Waypoint index at which the escorting helicopter will terminate its escort task.
            lastWptIndexFlag: Determines whether the helicopter will follow the ground group until it reaches
              a specified waypoint.
            lastWptIndexFlagChangedManually: Indicates whether the lastWptIndexFlag was manually configured
              rather than using system defaults.
            targetTypes: A numerically indexed table of `Attributes` defining which enemy unit types the escorting
              helicopter will engage.
        Hold:
          description: Hold task that commands ground forces
            to cease movement and maintain their current position.
        Land:
          description: Landing task that directs helicopters
            to touch down at specific coordinates.
          params:
            duration: Time in seconds that the helicopter will remain landed before automatically taking off
              if durationFlag is true.
            durationFlag: Determines whether the helicopter will remain on the ground for a specific duration
              before taking off again.
            point:
              type: Vec2
              description: A `Vec2` representing the landing coordinates in the DCS World coordinate system where the helicopter will attempt to touch down.
        Orbit:
          description: Orbit task that directs aircraft
            to fly various pattern types at specified locations.
          params:
            altitude: Altitude in meters the AI will maintain during the orbit.
            clockWise: Determines whether the anchored orbit will fly clockwise (true) or anti-clockwise (false).
            hotLegDir: Heading in radians that the aircraft will fly for the return leg of the anchored orbit
              pattern.
            legLength: Distance in meters that the aircraft will fly before turning in an anchored orbit pattern.
            pattern: Type of orbit pattern the AI will execute (RACE_TRACK, CIRCLE, Anchored).
            speed: Speed in meters per second the AI will maintain during the orbit pattern.
            width: Distance in meters that represents the diameter of the anchored orbit pattern.
            point:
              type: Vec2
              description: A `Vec2` representing the primary orbit point in the DCS World coordinate system.
            point2:
              type: Vec2
              description: A `Vec2` representing the secondary point for a Race-Track orbit pattern in the DCS World coordinate system.
        RecoveryTanker:
          description: Naval recovery tanker task that directs
            an aircraft to orbit above a vessel group, providing refueling services.
          params:
            altitude: Altitude in meters at which the tanker will orbit above the naval group.
            groupId: The group ID of the naval group to follow and provide tanker services to.
            lastWptIndex: Waypoint index of the naval group that, when reached, will cause the recovery tanker
              to end its task.
            lastWptIndexFlag: Determines whether the tanker task should terminate when the naval group reaches
              a specific waypoint.
            speed: Speed of the tanker in meters per second while performing its orbit pattern.
        Refueling:
          description: Air refueling task directing aircraft
            to seek and connect with the nearest available tanker.
        Strafing:
          description: Strafing task that directs AI to
            perform gun or rocket attacks on a ground point.
          params:
            attackQty: Number of attack passes the group will perform on the target.
            attackQtyLimit: Determines whether to use the attackQty parameter as a limit.
            direction: Attack direction in radians, defining the approach vector.
            directionEnabled: Determines whether to use the specified direction for attack.
            expend: Quantity of weapons to expend during the attack (QUARTER, TWO, ONE, FOUR, HALF, ALL).
            groupAttack: Determines whether each aircraft in the group will attack individually (true) or as
              a coordinated unit (false).
            length: Total length of the strafing target area in meters.
            weaponType: Weapon flag type to use for the attack.
            x: X coordinate of the target (alternative to using the point field).
            y: Y coordinate of the target (alternative to using the point field).
            point:
              type: Vec2
              description: A `Vec2` representing the target coordinates in the DCS World coordinate system.

  - series: liveries
    table: unmappedCountryUpstreamGaps
    note: >-
      Strings stock livery description.lua `countries` tables list that no
      country has as its ShortName; tools/datamine/extract_liveries.py keeps
      them in the record's `unmappedCountries`. Any other such string is an
      error, as is an entry no livery lists or that now maps.
    evidence: >-
      The Mission Editor asks for liveries by `country.ShortName`
      (MissionEditor/modules/loadLiveries.lua loadSchemes and its callers);
      ShortName is the 4th argument of `country:add` in
      Scripts/Database/db_countries.lua. Checked against every db.Countries
      ShortName of DCS 2.9.29.27468.
    value:
      "": Empty string listed after the real countries by 3 SA342Mistral liveries (Cyprus air force, Dutch Fictional, Portuguese Modern Fictional).
      EGP: Listed by 5 La_Combattante_II liveries (EGP_601-605); Egypt's ShortName is EGY.
      LIB: Listed by 5 La_Combattante_II liveries (LIB_518-522); Libya's ShortName is LBY.
      SPA: Listed by the f_a-18a livery grupo 12 eaf torrejon ab; Spain's ShortName is SPN.
      USAF: Listed with 75 real ShortNames (AUSAF among them) by 6 UB_32A, UB_32A_24 and b-8v20a liveries; no country has it (USAF Aggressors is AUSAF).
      XXX: Placeholder listed by 4 placeholder liveries (Leopard-2 in TechWeaponPack and Bazar leopard-2, mi-8mt, su-27).
      hide: Listed by 3 Soldier stinger liveries (default, GRC; USA with AUSAF); `hide` is a db_countries.lua country field, not a ShortName.

  # ----------------------------------------------------------------------------
  # Loadout rules and gun mixes: upstream gaps (tools/datamine/extract_units.py).
  # ----------------------------------------------------------------------------

  - series: stores
    table: loadoutRuleUpstreamGaps
    note: >-
      Store CLSIDs aircraft Pylons name in a launcher's `forbidden`/`required`
      `loadout` that no _G/launcher record defines; references to them are
      warnings in validate-data. An entry that now resolves is an error.
    evidence: >-
      Checked case-insensitively against every _G/launcher file of DCS
      2.9.30.28536; each defined CLSID named in the note differs by a brace
      or a suffix.
    value:
      "{BRU-70_3*GBU-38}": Named by AV8BNA pylon rules; the defined rack is {BRU-70A_3GBU-38}.
      "{{FN_HMP400}": Named by SA342L pylon rules; the defined pod is {FN_HMP400}.
      "{{FN_HMP400_100}": Named by SA342L pylon rules; the defined pod is {FN_HMP400_100}.
      "{{FN_HMP400_200}": Named by SA342L pylon rules; the defined pod is {FN_HMP400_200}.
      "{Tiny_Tim_Corsair}": Named by F4U-1D and F4U-1D_CW pylon rules; the defined launchers are {Tiny_Tim_Corsair_L} and {Tiny_Tim_Corsair_R}.

  - series: aircraft
    table: gunMixUpstreamGaps
    note: >-
      Aircraft whose Guns[].supply.mixes DCS does not resolve: a mix index
      naming no supply.shells entry, or not one mix per ammo_type label. The
      gun keeps no `mixes` when an index names no shell. Any other such
      aircraft is an error, as is an entry that now resolves.
    evidence: >-
      _G/db/Units Planes and Helicopters of DCS 2.9.30.28536; the indices are
      1-based into the same gun's supply.shells.
    value:
      A-20G: Guns[7] and Guns[8] (A20_TopTurret_M2_R/L) have one shell (M134_7_62_T) but mix {1, 1, 4}.
      MiG-29 Fulcrum: ammo_type has one label (HEI-T); its GSh_30_1 gun has no supply.mixes.
      Mirage-F1AD: Both defa_553 guns have one shell (DEFA552_30) but mixes {2, 1, 1, 1, 1, 1} and {1, 1, 2, 1, 1, 1}.
      Mirage-F1AZ: As Mirage-F1AD.
      Mirage-F1C: As Mirage-F1AD.
      Mirage-F1C-200: As Mirage-F1AD.
      Mirage-F1CE: As Mirage-F1AD.
      Mirage-F1CG: As Mirage-F1AD.
      Mirage-F1CH: As Mirage-F1AD.
      Mirage-F1CJ: As Mirage-F1AD.
      Mirage-F1CK: As Mirage-F1AD.
      Mirage-F1CR: Its one defa_553 gun has one shell (DEFA552_30) but mix {2, 1, 1, 1, 1, 1}.
      Mirage-F1CT: Its one defa_553 gun has one shell (DEFA552_30) but mix {1, 1, 2, 1, 1, 1}.
      Mirage-F1CZ: As Mirage-F1AD.
      Mirage-F1ED: As Mirage-F1AD.
      Mirage-F1EDA: As Mirage-F1AD.
      Mirage-F1EE: As Mirage-F1AD.
      Mirage-F1EH: As Mirage-F1AD.
      Mirage-F1EQ: As Mirage-F1AD.
      Mirage-F1JA: As Mirage-F1AD.
      Mirage-F1M-CE: As Mirage-F1AD.
      Mirage-F1M-EE: As Mirage-F1AD.
