  # ----------------------------------------------------------------------------
  # API argument probe: its mission and the argument values it tries first.
  # ----------------------------------------------------------------------------

  - series: probe
    table: mission
    note: >-
      The argument probe's mission (tools/datamine/probe_mission.py): per
      coalition a country, its aircraft's `callsign` (a name: Enfield11,
      Enfield21, ...; a number: 101, 102, ...), its airbase (warehouse stocked
      with `warehouse`) and two anchors, `land` (the airbase's reference point) and `sea`
      ([x, y] m, x north, y east). Each of `objects` is placed for both
      coalitions at `offset` from its `anchor`, named `<name>_BLUE` /
      `<name>_RED` (a group's unit `<group>-1`; a static's unit has the group
      name); `type` is one type or one per coalition. `kind`: plane,
      helicopter (airborne, orbiting at `alt` m and `speed` m/s, with `fuel`
      kg, radio on `radioMHz`), client (an airborne player slot), vehicle,
      ship, static (`category`; `unit` fields are copied into the static's
      unit). An aircraft's `fuel: internal` is its type's `aero.internalFuelKg`
      and `speed: optimal` its `performance.vOptMs` (aircraft series of the
      probed version, else the newest); a number is a probe setting. Every
      AI group but `fires` ones holds fire (`roe`: the scripting API's
      `AI.Option.<Air|Ground|Naval>.val.ROE` names for holding fire and for
      firing, resolved with `AI.Option.<domain>.id.ROE` from the API dump)
      and aircraft are immortal and invisible, so the two sides never
      destroy a sample. `zones`, `drawings` and `marks` sit at an
      offset from a side's anchor; zones are circles (`radius`) or quads
      (`quad` corners); a mark is made and `flags` are set by a
      mission-start script (a .miz has no marks or flag values). `samples`
      names the objects probe-call.lua's setupMission takes its class
      samples from (the mortar is ordered to fire at `target`, an offset from
      it, so a Weapon is in flight); a missing one is spawned at runtime.
    evidence: >-
      Anchors: DCS 2.9.29.27468 airbases/Caucasus/Kutaisi.json
      (airdromeId 25) and Sukhumi-Babushara.json (20) referencePoint; the sea
      anchors lie 40-45 km off the coast in the Black Sea (a CSG-8 Caucasus
      mission's carrier group sails at x -345676, y 499137). Types, shapes
      and cargo mass from .datamine/_G/db/Units of 2.9.29.27468; the
      helicopters' 40 m/s is a probe setting (the aircraft series gives
      rotary types no vOptMs); weapon wsTypes from .datamine/_G/__wstype_ids__.lua
      (AIM_9 4,4,7,22; AIM_120C 4,4,7,106; Mk_82 4,5,9,31); aircraft
      wsTypes from a mission editor warehouse (F-15C 1,1,1,6; Su-27 1,1,1,3).
      Countries USA (2) and Russia (0) are in MissionEditor/data/scripts/
      default_coalitions.lua blue and red; mission editor saves give US
      aircraft callsign tables ({1, 1, 1, name = "Enfield11"}) and Russian
      ones numbers (100). 251 MHz is in the UHF range of the F-15C, Su-27,
      UH-60A and Mi-8MT radios.
    value:
      theatre: Caucasus
      radioMHz: 251
      roe: {hold: WEAPON_HOLD, fires: OPEN_FIRE}
      sides:
        blue:
          country: {id: 2, name: USA}
          callsign: Enfield
          airbase: {id: 25, name: Kutaisi}
          land: [-284887, 683859]
          sea: [-300000, 590000]
        red:
          country: {id: 0, name: Russia}
          callsign: 100
          airbase: {id: 20, name: Sukhumi-Babushara}
          land: [-220592, 564392]
          sea: [-240000, 530000]
      objects:
        - {name: PROBE_PLANE, kind: plane, anchor: land, offset: [0, 0], alt: 3000, type: {blue: F-15C, red: Su-27}, fuel: internal, speed: optimal}
        - {name: PROBE_HELO, kind: helicopter, anchor: land, offset: [2000, -2000], alt: 300, type: {blue: UH-60A, red: Mi-8MT}, fuel: internal, speed: 40}
        - {name: PROBE_CLIENT, kind: client, anchor: land, offset: [-3000, 0], alt: 4000, type: {blue: F-15C, red: Su-27}, fuel: internal, speed: optimal}
        - {name: PROBE_GROUND, kind: vehicle, anchor: land, offset: [1500, 1500], type: {blue: M-1 Abrams, red: T-72B}}
        - {name: PROBE_SAM, kind: vehicle, anchor: land, offset: [1500, 1700], type: {blue: Roland ADS, red: Osa 9A33 ln}}
        - {name: PROBE_ARTY, kind: vehicle, anchor: land, offset: [1500, 1900], type: 2B11 mortar, fires: true}
