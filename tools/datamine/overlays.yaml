# Every hand-authored fact of the datamine lives here; extractor code holds
# only generic logic. Loaded by tools/datamine/overlays.py.
#
# Provenance: a record's `_source` maps a field path to how its value was
# obtained; a field absent from `_source` was read from DCS as is.
#   hand-authored  set by a patch here, or taken or derived from a table here
#   corrected      a DCS value transformed by a patch `op` here
#   launcher, table, rockets  derived from other DCS data (see extract_stores.py); not from here
#
# Every entry has `series`, `note` and `evidence`, and optionally `versions`
# (the DCS versions it applies to; default all), plus one of:
#   id + field + value   set a field of an extracted record    -> hand-authored
#   id + field + op      transform a datamined field            -> corrected
#   id + field + add     add the list element `field`'s last `name[key=value]`
#                        selects ({key: value, ...add}), stamped by its path
#                        on the record (or the enclosing selected element)
#                                                               -> hand-authored
#   table + value        a table an extractor reads: a key -> value mapping,
#                        or a list of rules; the extractor names the provenance
# `id` may list several records, each patched alike.
# `field` is a dotted path; `name[key=value]` selects the one list element whose
# `key` equals `value`. A rule's `when` maps a fact the extractor names to
# comparisons (`<`, `<=`, `>`, `>=` -> bound), all of which must hold; the first
# matching rule wins and a rule without `when` always matches.
#
# Stale entries are errors: a patch whose record or field is gone, that no
# longer changes the value or whose `raw_sign` guard fails, an `add` whose
# element is extracted now, and a table key or rule nothing uses stop the
# extraction; an upstream gap that now resolves fails the extraction
# (threats) or `task validate-data` (stores, units).

entries:
  # ----------------------------------------------------------------------------
  # Record patches: fix or fill a field of one extracted record.
  # ----------------------------------------------------------------------------

  - series: aircraft
    id: F-16C_50
    field: stations[station=10].position.lateral
    op: negate
    raw_sign: 1
    note: Chin hardpoint 10 is on the left; its pylon Z ships with the right-hand sign.
    evidence: >-
      _G/db/Units/Planes/Plane F-16C_50 Pylons: stations 1-4 (left) have Z < 0,
      yet station 10 has Z = +0.55 and station 11 has Z = -0.55.

  - series: aircraft
    id: F-16C_50
    field: stations[station=11].position.lateral
    op: negate
    raw_sign: -1
    note: Chin hardpoint 11 is on the right; its pylon Z ships with the left-hand sign.
    evidence: See the station 10 entry.

  # AI action parameters no DCS source shows (Mission Editor defaults, its
