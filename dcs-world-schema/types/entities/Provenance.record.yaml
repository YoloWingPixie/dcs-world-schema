globals: {}

types:
  Entity.Provenance:
    kind: record
    description: "Provenance of a batch of extracted entities: the DCS install and extractor that produced them."
    fields:
      dcsVersion:
        type: string
        description: "DCS World version the data was extracted from."
      extractedAt:
        type: string
        description: "ISO 8601 timestamp of when the extraction ran."
      extractor:
        type: string
        description: "Name and version of the extractor that produced the data."
      source:
        type: string
        description: "Source of the data (for example the _G self-dump)."
      constants:
        type: Entity.ConstantFamily[]
        description: "The DCS numeric constant families read from the dump's `__constants__.lua`."
      modulesPresent:
        type: string[]
        description: "Names of the DCS plugins (`_origin`) that registered at least one extracted unit, projectile, or launcher record."
    required: [dcsVersion, extractedAt, extractor, source, constants, modulesPresent]

  Entity.ConstantFamily:
    kind: record
    description: "One family of DCS numeric constants captured in the `_G` dump."
    fields:
      family:
        type: string
        description: "Constant family (for example `wsType`, `CAT`, `country`)."
      count:
        type: number
        description: "Number of constants in the family."
    required: [family, count]
