globals: {}

types:
  Entity.Rack:
    kind: record
    description: "A multiple-ejector or launch rack a store can be mounted through."
    fields:
      id:
        type: string
        description: "Unique rack identifier."
      displayName:
        type: string
        description: "Optional human-readable rack name."
      ejectors:
        type: number
        description: "Number of ejector or launch positions on the rack."
      aero:
        type: Entity.Aero
        description: "Optional aerodynamic and mass properties of the rack."
      attributes:
        type: string[]
        description: "Optional cross-reference: `Entity.Attribute` ids describing this rack."
      sourcePaths:
        type: string[]
        description: "Optional dump paths of the `_G` dump files (`_G/...`) that define this rack, joined by `Pylons` `ShapeName`; sorted."
    required: [id, ejectors]
