        type: string
        description: "Optional NATO reporting name DCS gives the unit: the double-quoted part of an `Air Defence` unit's `displayName` (`SA-11 Buk \"Gadfly\" LN` -> `Gadfly`), whether it names the whole system (`Gadfly`, `Grumble`) or the unit itself (`Flat Face`, `Fan Song`); hand-authored in tools/datamine/overlays.yaml (`_source`) where DCS quotes none, or quotes the system's name on a part NATO names on its own (the S-300PS and Buk radars: `Flap Lid A`, `Fire Dome`). Quotes on other units (nicknames such as `Jimmy`) are not taken."
      attributes:
        type: string[]
        ref: Entity.Attribute
        description: "Cross-reference: `Entity.Attribute` ids describing this vehicle."
      tags:
        type: string[]
        description: "Optional `tags` (for example `Air Defence`, `SAM SHORAD`), in DCS order."
      sensors:
        type: string[]
        ref: Entity.Sensor
        description: "Optional cross-reference: `Entity.Sensor` ids fitted to this vehicle."
      weapons:
        type: string[]
        description: "Optional cross-reference: `Entity.Weapon` ids carried by this vehicle."
      model:
        type: Entity.UnitModel
        description: "Optional 3D model identification."
      life:
        type: Entity.UnitLife[]
        description: "Optional life values, one per DCS field that sets one (they are on different scales)."
      dimensions:
        type: Entity.SurfaceDimensions
        description: "Optional chassis size and mass."
      mobility:
        type: Entity.VehicleMobility
        description: "Optional mobility."
      crew:
        type: Entity.SurfaceCrew
        description: "Optional crew."
      missionOptions:
        type: Entity.MissionOption[]
        description: "Optional `AddPropVehicle`, DCS order."
      detection:
        type: Entity.UnitDetection
        description: "Optional detection and threat ranges."
      armour:
        type: Entity.UnitArmour
        description: "Optional armour."
      cargo:
        type: Entity.UnitCargo
        description: "Optional cargo and towing."
      fireControl:
        type: Entity.FireControl
        description: "Optional named fields of the unit's `WS` table."
      facilities:
        type: Entity.UnitFacilities
        description: "Optional navigation aids, landing facilities and parking."
      weaponSystems:
        type: Entity.WeaponSystem[]
        description: "Optional launchers (`WS[i].LN[j]`), in DCS `WS` then `LN` order."
      operators:
        type: Entity.Operator[]
        description: "Optional countries that operate this vehicle and their service-year ranges."
      _source:
        type: any
        description: "Provenance map keyed by field path: `natoReportingName` is `hand-authored` when it comes from tools/datamine/overlays.yaml. Absent fields are datamined."
      sourcePaths:
        type: string[]
        description: "Optional dump paths (`_G/db/Units/...`) of the `db.Units` records that define this vehicle, joined by `type`; sorted."
    required: [id, displayName, attributes]

