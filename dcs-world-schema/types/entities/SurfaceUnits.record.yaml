globals: {}

types:
  Entity.WeaponRequirement:
    kind: record
    description: "One requirement of a `depends_on_unit` alternative, as DCS writes it: `{\"self\", n}` (`selfWs`), `{\"none\"}` (`none`), `{unit}` or `{unit, n}` (`unit`, `ws`)."
    fields:
      unit:
        type: string
        ref: "Entity.Aircraft | Entity.GroundVehicle | Entity.Personnel | Entity.Ship | Entity.Structure"
        description: "Optional cross-reference: the unit type required (any unit series)."
      ws:
        type: number
        description: "Optional number DCS gives after `unit`, raw."
      selfWs:
        type: number
        description: "Optional weapon-system index (`WS[n]`) on the same unit."
      none:
        type: boolean
        description: "Optional; true for DCS's `{\"none\"}` requirement."
    required: []

  Entity.WeaponRequirementSet:
    kind: array
    arrayOf: Entity.WeaponRequirement
    description: "One `depends_on_unit` alternative: requirements that together enable the launcher."

  Entity.AngleSector:
    kind: array
    arrayOf: number
    description: "One traverse sector of `WS[i].angles` exactly as DCS stores it, radians."

  Entity.WeaponPayload:
    kind: record
    description: "One payload (`WS[i].LN[j].PL[k]`) of a launcher. Each field is absent when DCS does not define it."
    fields:
      weapon:
        type: string
        ref: Entity.Weapon
        description: "Optional cross-reference: the `Entity.Weapon` id of `type_ammunition` (the projectile named in wsType slot 4, or a `weapons.*` resource name); absent when it does not resolve."
      gunAmmo:
        type: string[]
        ref: Entity.GunAmmo
        description: "Optional cross-reference: `Entity.GunAmmo` ids in `shell_name` (unique, sorted)."
      ammoName:
        type: string
        description: "Optional `name_ammunition`."
      ammoDisplayName:
        type: string
        description: "Optional `shell_display_name`."
      ammoCapacity:
        type: number
        description: "Optional `ammo_capacity`: rounds or missiles in this payload."
      portionAmmoCapacity:
        type: number
        description: "Optional `portionAmmoCapacity`."
      reloadTimeS:
        type: number
        description: "Optional `reload_time`, seconds."
      portionReloadTimeS:
        type: number
        description: "Optional `portion_reload_time`, seconds."
      shotDelayS:
        type: number
        description: "Optional `shot_delay`, seconds."
      switchOnDelay:
        type: number
        description: "Optional `switch_on_delay`, delay before the payload can fire once selected, unit not stated."
      feedSlot:
        type: number
        description: "Optional `feedSlot`, the ammunition feed this payload loads from, raw."
      automaticLoader:
        type: boolean
        description: "Optional `automaticLoader`, whether the payload is loaded automatically."
    required: []

  Entity.SlewRate:
    kind: record
    description: "Turret slew rates of a weapon system, radians per second."
    fields:
      yaw:
        type: number
        description: "Optional `WS[i].omegaY`."
      pitch:
        type: number
        description: "Optional `WS[i].omegaZ`."
    required: []

  Entity.WeaponSystem:
    kind: record
    description: "One launcher (`WS[i].LN[j]`) of a ground vehicle or ship, whether it fires (has `PL` payloads) or is a tracking channel. Fields come from the unit's effective (template-inherited) launcher data; each is absent when DCS does not define it."
    fields:
      ws:
        type: number
        description: "1-based weapon-system index `i`."
      ln:
        type: number
        description: "1-based launcher index `j` within `WS[i].LN`."
      launcherType:
        type: number
        description: "Optional `LN.type`, the raw DCS number."
      name:
        type: string
        description: "Optional `LN.name`, else `WS[i].name`."
      displayName:
        type: string
        description: "Optional `LN.display_name`, else `WS[i].display_name`."
      weapons:
        type: string[]
        ref: Entity.Weapon
        description: "Optional cross-reference: the payloads' `weapon` ids (unique, sorted)."
      gunAmmo:
        type: string[]
        ref: Entity.GunAmmo
        description: "Optional cross-reference: the payloads' `gunAmmo` ids (unique, sorted)."
      payloads:
        type: Entity.WeaponPayload[]
        description: "Optional payloads, in `PL` order; absent for a launcher without `PL`."
      rMinKm:
        type: number
        description: "Optional minimum engagement range in kilometres (launcher `distanceMin`, else the weapon system's)."
      rMaxKm:
        type: number
        description: "Optional maximum engagement range in kilometres (launcher `distanceMax`, else the weapon system's)."
      hMinM:
        type: number
        description: "Optional minimum target altitude in metres (`min_trg_alt`)."
      hMaxM:
        type: number
        description: "Optional maximum target altitude in metres (`max_trg_alt`)."
      missileChannels:
        type: number
        description: "Optional `max_number_of_missiles_channels` (or DCS's other spelling `max_number_of_missile_channels`; both set and different is an extraction error)."
      dependsOn:
        type: Entity.WeaponRequirementSet[]
        description: "Optional `depends_on_unit`: alternatives, each a list of requirements that together enable the launcher. Absent (and reported at extraction) when DCS writes it in another shape."
      reactionTimeS:
        type: number
        description: "Optional `reactionTime`, seconds."
      launchDelayS:
        type: number
        description: "Optional `launch_delay`, seconds."
      ecmK:
        type: number
        description: "Optional `ECM_K`, raw DCS value."
      reflectionLimit:
        type: number
        description: "Optional `reflection_limit`, raw DCS value."
      beamWidthRad:
        type: number
        description: "Optional `beamWidth`, radians."
      frequencyRangeHz:
        type: number[]
        description: "Optional `frequencyRange` `[min, max]` as DCS gives it; hertz by DCS convention, though a few DCS entries hold values that are not (e.g. `[14.2, 14.8]`)."
      externalTrackingAwacs:
        type: boolean
        description: "Optional `external_tracking_awacs`."
      maxShootingSpeed:
        type: number
        description: "Optional `maxShootingSpeed`, the raw DCS value (unit not stated by DCS)."
      barrels:
        type: number
        description: "Optional number of `BR` barrel entries."
      sectorsRad:
        type: Entity.AngleSector[]
        description: "Optional `WS[i].angles`: the traverse sectors exactly as DCS stores them, radians."
      slewRateRadS:
        type: Entity.SlewRate
        description: "Optional turret slew rates of `WS[i]`."
      anglesMechRad:
        type: Entity.AngleSector[]
        description: "Optional `WS[i].angles_mech`: the mechanical traverse sectors as DCS stores them, radians."
      referenceAngleXRad:
        type: number
        description: "Optional `WS[i].reference_angle_X`, at-rest roll angle of the mount, radians."
      referenceAngleYRad:
        type: number
        description: "Optional `WS[i].reference_angle_Y`, at-rest traverse angle of the mount, radians."
      referenceAngleZRad:
        type: number
        description: "Optional `WS[i].reference_angle_Z`, at-rest elevation angle of the mount, radians."
      reloadAngleY:
        type: number
        description: "Optional `WS[i].reloadAngleY`, traverse angle the mount reloads at, unit not stated."
      reloadAngleZ:
        type: number
        description: "Optional `WS[i].reloadAngleZ`, elevation angle the mount reloads at, unit not stated."
      maxLeft:
        type: number
        description: "Optional `WS[i].maxLeft`, left traverse limit, unit not stated."
      maxRight:
        type: number
        description: "Optional `WS[i].maxRight`, right traverse limit, unit not stated."
      maxTop:
        type: number
        description: "Optional `WS[i].maxTop`, upper elevation limit, unit not stated."
      maxBottom:
        type: number
        description: "Optional `WS[i].maxBottom`, lower elevation limit, unit not stated."
      baseWs:
        type: number
        description: "Optional `WS[i].base`, the index of the weapon system this mount sits on."
      mountEcmK:
        type: number
        description: "Optional `WS[i].ECM_K` (the mount's own, beside the launcher's `ecmK`), raw."
      radarType:
        type: number
        description: "Optional `WS[i].radar_type`, the mount's radar type, the raw DCS number."
      moveable:
        type: boolean
        description: "Optional `WS[i].moveable`, whether the mount traverses."
      stabilizer:
        type: boolean
        description: "Optional `WS[i].stabilizer`, whether the mount is stabilized."
      laser:
        type: boolean
        description: "Optional `WS[i].laser`, whether the mount has a laser rangefinder."
      canSetTacticalDir:
        type: boolean
        description: "Optional `WS[i].canSetTacticalDir`, whether the mount can be set to a tactical direction."
      mountBeforeMove:
        type: boolean
        description: "Optional `WS[i].mount_before_move`, whether the mount returns to rest before the unit moves."
      sharesBarrelsBetweenLaunchers:
        type: boolean
        description: "Optional `WS[i].sharesBarrelsBetweenLaunchers`, whether the mount's launchers share barrels."
      distanceMaxForFcs:
        type: number
        description: "Optional `distanceMaxForFCS`, maximum range of the fire-control system, unit not stated."
      combatRange:
        type: number
        description: "Optional `combatRange`, combat range, unit not stated."
      launchDelayHuman:
        type: number
        description: "Optional `launch_delay_human`, launch delay when a player commands the unit, unit not stated."
      sightMaxTanVel:
        type: number
        description: "Optional `sightMaxTanVel`, maximum target tangential velocity the sight follows, unit not stated."
      minLaunchAngle:
        type: number
        description: "Optional `min_launch_angle`, minimum launch elevation, unit not stated."
      railLength:
        type: number
        description: "Optional `rail_length`, launch rail length, unit not stated."
      inclinationCorrectionBias:
        type: number
        description: "Optional `inclination_correction_bias`, elevation correction bias, unit not stated."
      inclinationCorrectionUpperLimit:
        type: number
        description: "Optional `inclination_correction_upper_limit`, elevation correction upper limit, unit not stated."
      dispertionReductionFactor:
        type: number
        description: "Optional `dispertionReductionFactor`, shot dispersion reduction factor, raw."
      radialDisperse:
        type: number
        description: "Optional `radialDisperse`, radial shot dispersion, unit not stated."
      missileControlInterval:
        type: number
        description: "Optional `missileControlInterval`, interval between missile guidance commands, unit not stated."
      outVelocity:
        type: number
        description: "Optional `out_velocity`, launch velocity of the projectile, unit not stated."
      maxTrackingSpeed:
        type: number
        description: "Optional `maxTrackingSpeed`, maximum target speed the launcher tracks, unit not stated."
      reloadTime:
        type: number
        description: "Optional `reload_time` of the launcher (the payloads' own are `reloadTimeS`), unit not stated."
      barrelsReloadType:
        type: number
        description: "Optional `barrels_reload_type`, barrel reload order (a `BarrelsReloadTypes` code), raw."
      primaryWeapon:
        type: boolean
        description: "Optional `primaryWeapon`, whether this is the unit's primary weapon."
      secondary:
        type: boolean
        description: "Optional `secondary`, whether this is a secondary weapon."
      useTargetAccelInSight:
        type: boolean
        description: "Optional `useTargetAccelInSight`, whether the sight leads with the target's acceleration."
      automaticLoader:
        type: boolean
        description: "Optional `automaticLoader`, whether the launcher has an automatic loader."
      sensor:
        type: Entity.LauncherSensor
        description: "Optional `sensor` table of the launcher: its sight errors."
    required: [ws, ln]

  Entity.LauncherSensor:
    kind: record
    description: "A launcher's `sensor` table (`WS[i].LN[j].sensor`): the sight's type and errors, raw DCS values."
    fields:
      type:
        type: number
        description: "Optional `type`, the sight type, the raw DCS number."
      deviationErrorAzimuth:
        type: number
        description: "Optional `deviation_error_azimuth`, azimuth error, unit not stated."
      deviationErrorElevation:
        type: number
        description: "Optional `deviation_error_elevation`, elevation error, unit not stated."
      deviationErrorDistance:
        type: number
        description: "Optional `deviation_error_distance`, distance error, unit not stated."
      deviationErrorSpeedSensor:
        type: number
        description: "Optional `deviation_error_speed_sensor`, target speed error, unit not stated."
      deviationErrorStability:
        type: number
        description: "Optional `deviation_error_stability`, stabilization error, unit not stated."
    required: []

  Entity.FireControl:
    kind: record
    description: "The named (non-indexed) fields of a unit's `WS` table."
    fields:
      maxTargetDetectionRangeM:
        type: number
        description: "Optional `WS.maxTargetDetectionRange`, metres."
      radarType:
        type: Entity.UnitRadarType | number
        description: "Optional `WS.radar_type`, the raw DCS number (a value outside `Entity.UnitRadarType` is kept as is)."
      radarTypeName:
        type: string
        description: "Optional `Entity.UnitRadarType` constant name of `radarType` (absent when no single constant carries it)."
      fireOnMove:
        type: boolean
        description: "Optional `WS.fire_on_march`."
      isDetector:
        type: boolean
        description: "Optional `WS.isDetector`."
      radarRotationType:
        type: number
        description: "Optional `WS.radar_rotation_type`, the search radar's rotation type, the raw DCS number."
      searchRadarMaxElevationRad:
        type: number
        description: "Optional `WS.searchRadarMaxElevation`, maximum elevation of the search radar, radians."
      searchRadarFrequencies:
        type: number[][]
        description: "Optional `WS.searchRadarFrequencies`, the search radar's `[min, max]` frequency bands as DCS gives them, unit not stated."
      smoke:
        type: string[]
        description: "Optional `WS.smoke`, smoke-grenade launcher names, in DCS order."
    required: []

  Entity.SurfaceDimensions:
    kind: record
    description: "Hull or chassis size and mass: a ground vehicle's `chassis.length`/`width`/`mass`, a ship's `Length`/`Width`/`Height`/`mass`."
    fields:
      lengthM:
        type: number
        description: "Optional length, metres."
      widthM:
        type: number
        description: "Optional width, metres."
      heightM:
        type: number
        description: "Optional height, metres (ships only)."
      massKg:
        type: number
        description: "Optional mass, kilograms."
      shipLengthM:
        type: number
        description: "Optional `shipLength`, waterline length in metres (ships)."
      xNoseM:
        type: number
        description: "Optional `X_nose`, distance from the model origin to the bow at the waterline in metres (ships)."
      xTailM:
        type: number
        description: "Optional `X_tail`, distance from the model origin to the stern at the waterline in metres (ships)."
      tailWidth:
        type: number
        description: "Optional `Tail_Width`, width of the stern for the wake, unit not stated (ships)."
    required: []

  Entity.VehicleMobility:
    kind: record
    description: "Ground vehicle mobility from `MaxSpeed`, `mobile` and `chassis`."
    fields:
      mobile:
        type: boolean
        description: "Optional `mobile`."
      maxSpeedKmh:
        type: number
        description: "Optional `MaxSpeed`, km/h."
      maxRoadSpeedMs:
        type: number
        description: "Optional `chassis.max_road_velocity`, m/s."
      maxSlopeRad:
        type: number
        description: "Optional `chassis.max_slope`, radians."
      maxVertObstacleM:
        type: number
        description: "Optional `chassis.max_vert_obstacle`, metres."
      minTurnRadiusM:
        type: number
        description: "Optional `chassis.min_turn_radius`, metres."
      fordingDepthM:
        type: number
        description: "Optional `chassis.fordingDepth`, metres."
      canSwim:
        type: boolean
        description: "Optional `chassis.canSwim`."
      enginePower:
        type: number
        description: "Optional `chassis.engine_power`, the raw DCS value (DCS files disagree on its unit)."
      rMaxM:
        type: number
        description: "Optional `chassis.r_max`, drive wheel or track sprocket radius in metres."
      maxAcceleration:
        type: number
        description: "Optional `chassis.max_acceleration`, maximum acceleration, unit not stated."
      traceWidth:
        type: number
        description: "Optional `chassis.trace_width`, width of the wheel or track trace, unit not stated."
      gearType:
        type: number
        description: "Optional `chassis.gear_type`, the running gear (a `GT_t.GEAR_TYPES` code: wheels, tracks ...), raw."
      mainGearRatio:
        type: number
        description: "Optional `chassis.mainGearRatio`, final drive ratio, raw."
      gearRatios:
        type: number[]
        description: "Optional `chassis.gearRatios`, gearbox ratios in DCS order, raw."
      engineMaxRpm:
        type: number
        description: "Optional `chassis.engineMaxRPM`, maximum engine speed, rpm."
      engineMinRpm:
        type: number
        description: "Optional `chassis.engineMinRPM`, minimum engine speed, rpm."
      engineMaxPowerRpm:
        type: number
        description: "Optional `chassis.engineMaxPowerRPM`, engine speed at maximum power, rpm."
      engineMoi:
        type: number
        description: "Optional `chassis.engineMOI`, engine moment of inertia, unit not stated."
      waterlineLevel:
        type: number
        description: "Optional `chassis.waterline_level`, waterline height when swimming, unit not stated."
      maxTrenchWidth:
        type: number
        description: "Optional `chassis.max_trench_width`, widest trench crossed, unit not stated."
      canWade:
        type: boolean
        description: "Optional `chassis.canWade`."
      automaticTransmission:
        type: boolean
        description: "Optional `chassis.automaticTransmission`."
    required: []

  Entity.ShipMobility:
    kind: record
    description: "Ship mobility."
    fields:
      maxSpeedKmh:
        type: number
        description: "Optional `MaxSpeed`, km/h."
      maxSpeedMs:
        type: number
        description: "Optional `max_velocity`, m/s."
      minTurnRadiusM:
        type: number
        description: "Optional `R_min`, minimum turn radius in metres."
      draftM:
        type: number
        description: "Optional `draft` (or DCS's other spelling `Draft`), metres."
      economyDistance:
        type: number
        description: "Optional `economy_distance`, raw (metres by their values: 74080000 = 40000 NM on the Nimitz class)."
      economyVelocityMs:
        type: number
        description: "Optional `economy_velocity`, economy speed, m/s."
      raceDistance:
        type: number
        description: "Optional `race_distance`, raw (as `economyDistance`)."
      raceVelocityMs:
        type: number
        description: "Optional `race_velocity`, maximum (race) speed, m/s."
      speedup:
        type: number
        description: "Optional `speedup`, acceleration rate, unit not stated."
      distFindObstacles:
        type: number
        description: "Optional `distFindObstacles`, distance at which obstacles are detected for avoidance, unit not stated."
      riverCraft:
        type: boolean
        description: "Optional `riverCraft`, whether the ship is a river craft."
      minPeriscopeDepth:
        type: number
        description: "Optional `minPeriscopeDepth`, shallowest periscope depth (submarines), unit not stated."
      maxPeriscopeDepth:
        type: number
        description: "Optional `maxPeriscopeDepth`, deepest periscope depth (submarines), unit not stated."
      periscopeHeight:
        type: number
        description: "Optional `periscopeHeight`, periscope height (submarines), unit not stated."
    required: []

  Entity.ArmourRow:
    kind: array
    arrayOf: number
    description: "One `armour_scheme` row `[fromDeg, toDeg, factor]` as DCS gives it."

  Entity.ArmourScheme:
    kind: record
    description: "`armour_scheme`: per hull/turret aspect, rows `[fromDeg, toDeg, factor]` as DCS gives them."
    fields:
      hullAzimuth:
        type: Entity.ArmourRow[]
        description: "Optional `hull_azimuth`."
      hullElevation:
        type: Entity.ArmourRow[]
        description: "Optional `hull_elevation`."
      turretAzimuth:
        type: Entity.ArmourRow[]
        description: "Optional `turret_azimuth`."
      turretElevation:
        type: Entity.ArmourRow[]
        description: "Optional `turret_elevation`."
    required: []

  Entity.UnitArmour:
    kind: record
    description: "Armour of a ground vehicle or ship."
    fields:
      thickness:
        type: number
        description: "Optional `chassis.armour_thickness`, the raw DCS value (unit not stated by DCS)."
      scheme:
        type: Entity.ArmourScheme
        description: "Optional `armour_scheme`."
    required: []

  Entity.SurfaceCrew:
    kind: record
    description: "Ground vehicle crew."
    fields:
      count:
        type: number
        description: "Optional `Crew`."
      members:
        type: string[]
        description: "Optional `crew_members` roles, in DCS order."
    required: []

  Entity.CarrierOls:
    kind: record
    description: "`OLS` optical landing system of a ship."
    fields:
      type:
        type: number
        description: "`OLS.Type`, the raw DCS number (`GT_t.OLS_TYPE`)."
      meatBallArg:
        type: number
        description: "Optional `MeatBallArg` model argument."
      cutLightsArg:
        type: number
        description: "Optional `CutLightsArg` model argument."
      datumAndWaveOffLightsArg:
        type: number
        description: "Optional `DatumAndWaveOffLightsArg` model argument."
      glideslopeBasicAngleDeg:
        type: number
        description: "Optional `GlideslopeBasicAngle`, degrees."
      verticalCoverageAngleDeg:
        type: number
        description: "Optional `VerticalCoverageAngle`, degrees."
    required: [type]

  Entity.GlidePath:
    kind: record
    description: "The six glide-path values of a `RunWays` entry, named as the DCS carrier files' comment names them; raw DCS values."
    fields:
      low:
        type: number
        description: "`lowGlidePath`."
      slightlyLow:
        type: number
        description: "`slightlyLowGlidePath`."
      onLower:
        type: number
        description: "`onLowerGlidePath`."
      onUpper:
        type: number
        description: "`onUpperGlidePath`."
      slightlyHigh:
        type: number
        description: "`slightlyHighGlidePath`."
      high:
        type: number
        description: "`highGlidePath`."
    required: [low, slightlyLow, onLower, onUpper, slightlyHigh, high]

  Entity.CarrierRunway:
    kind: record
    description: "One `RunWays[i]` entry of a ship, laid out as the DCS carrier files' comment gives it (`VppStartPoint, azimuth (degree), Length_Vpp, Width_Vpp, alsArgument, <glide path>`); the first entry is the landing strip."
    fields:
      start:
        type: number[]
        description: "Start point `{x, y, z}` in the ship's model frame, metres."
      azimuthDeg:
        type: number
        description: "Azimuth, degrees."
      lengthM:
        type: number
        description: "Length, metres."
      widthM:
        type: number
        description: "Width, metres."
      alsArgument:
        type: number
        description: "`alsArgument`, raw DCS value."
      glidePath:
        type: Entity.GlidePath
        description: "Glide-path values."
    required: [start, azimuthDeg, lengthM, widthM, alsArgument, glidePath]

  Entity.UnitFacilities:
    kind: record
    description: "Navigation aids, landing facilities and parking a ship (or other surface unit) provides."
    fields:
      tacan:
        type: boolean
        description: "Optional `TACAN`."
      icls:
        type: boolean
        description: "Optional `ICLS`."
      lrls:
        type: boolean
        description: "Optional `LRLS`."
      ols:
        type: Entity.CarrierOls
        description: "Optional `OLS`."
      numParking:
        type: number
        description: "Optional `numParking`."
      planeNum:
        type: number
        description: "Optional `Plane_Num_`."
      helicopterNum:
        type: number
        description: "Optional `Helicopter_Num_`."
      runways:
        type: Entity.CarrierRunway[]
        description: "Optional `RunWays`, in DCS order."
      deckLevelM:
        type: number
        description: "Optional `DeckLevel`, metres."
      tacanPosition:
        type: number[]
        description: "Optional `TACAN_position` `{x, y, z}` in the ship's model frame, metres."
      tacanDefaultChannel:
        type: number
        description: "Optional `TACAN_def_channel`."
      iclsLocalizerPosition:
        type: number[]
        description: "Optional `ICLS_Localizer_position`: `{x, y, z}` in the model frame, metres, then a fourth value, raw."
      iclsGlideslopePosition:
        type: number[]
        description: "Optional `ICLS_Glideslope_position`: `{x, y, z}` in the model frame, metres, then a fourth value, raw."
      landingPoint:
        type: number[]
        description: "Optional `Landing_Point` `{x, y, z}` in the model frame, metres."
      arrestingGears:
        type: Entity.ArrestingGear[]
        description: "Optional `ArrestingGears`, in DCS order (their count is `ArrestingGearsNumber`, checked)."
      taxiRoutes:
        type: Entity.PathRoute[]
        description: "Optional `TaxiRoutes`, in DCS order (their count is `RoutesNumber`, checked)."
      helicopterSpawnTerminals:
        type: Entity.SpawnTerminal[]
        description: "Optional `HelicopterSpawnTerminal` entries, in DCS order (their count is `TerminalNumber`, checked)."
    required: []

  Entity.ArrestingGear:
    kind: record
    description: "One `ArrestingGears` wire: each end is a model connector or a position."
    fields:
      leftConnector:
        type: string
        description: "Optional `Left.connector_name`."
      rightConnector:
        type: string
        description: "Optional `Right.connector_name`."
      leftPosition:
        type: number[]
        description: "Optional `Left.pos` `{x, y, z}`, model frame, metres."
      rightPosition:
        type: number[]
        description: "Optional `Right.pos` `{x, y, z}`, model frame, metres."
    required: []

  Entity.PathPoint:
    kind: record
    description: "One `{{x, y, z}, n, ...}` point of a ship route."
    fields:
      position:
