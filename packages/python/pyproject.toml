[project]
name = "dcs-world-reference"
version = "0.4.0"
description = "DCS World reference data (units, weapons, airbases, beacons, ...) as typed dictionaries (DCS 2.9.30.28536)"
keywords = ["dcs-world", "dcs", "reference-data", "dcs-2.9.30.28536"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/YoloWingPixie/dcs-world-schema"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The data, types and loaders are generated and gitignored.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["src/dcs_world_reference"]

[tool.hatch.build.targets.sdist]
include = ["src/dcs_world_reference", "README.md"]
