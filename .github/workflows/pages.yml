name: Reference site (GitHub Pages)

# The site is a static shell that queries the released SQLite database in the browser
# (HTTP range requests). A data update only swaps the .sqlite: the shell is rebuilt only
# when site/ or the API schema changed (cached by content hash).
#
# Runs after a release (CD workflow) or by hand with a release tag. Repository settings:
# Settings -> Pages -> Source: "GitHub Actions"; the github-pages environment must allow
# the default branch (and tags, for manual runs on a tag).

on:
  workflow_run:
    workflows: ["DCS World Schema CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .sqlite to publish (default: latest release)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  shell:
    name: Build the site shell
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Shell cache key
        id: key
        run: echo "key=site-shell-${{ hashFiles('site/**', '!site/node_modules/**', '!site/out/**', '!site/.next/**', 'dcs-world-schema/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore a shell built from the same sources
        id: cache
        uses: actions/cache@v4
        with:
          path: site/out
          key: ${{ steps.key.outputs.key }}

      - name: Set up Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python, uv and Task (API docs read the merged schema)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install uv
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the shell (no database)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SITE_SQLITE: none
          SITE_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          task uv:sync
          task merge
          corepack enable
          cd site
          pnpm install --frozen-lockfile
          pnpm build

      - name: Hand the shell to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site-shell
          path: site/out
          retention-days: 1

  deploy:
    name: Publish shell + database
    needs: shell
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-shell
          path: site

      - name: Fetch the release's database
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'dcs-world-reference-*-dcs*.sqlite' --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'dcs-world-reference-*-dcs*.sqlite' --dir release
          fi
          files=(release/*.sqlite)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected one .sqlite asset, got ${#files[@]}"
            exit 1
          fi
          mkdir -p site/data
          # A stable URL the shell reads, and the versioned file for direct downloads.
          cp "${files[0]}" site/data/reference.sqlite
          cp "${files[0]}" "site/data/$(basename "${files[0]}")"
          touch site/.nojekyll
          ls -l site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
