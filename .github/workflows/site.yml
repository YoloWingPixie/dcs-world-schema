name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  shell:
    name: Build shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: echo "key=site-shell-${{ hashFiles('site/**', '!site/node_modules/**', '!site/out/**', '!site/.next/**', 'dcs-world-schema/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore shell
        id: cache
        uses: actions/cache@v4
        with:
          path: site/out
          key: ${{ steps.key.outputs.key }}

      - name: Set up Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv and Task
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install uv
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build shell
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SITE_SQLITE: none
          SITE_LUA: none
        run: |
          task uv:sync
          task merge
          corepack enable
          cd site
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site-shell
          path: site/out
          retention-days: 1

  database:
    name: Build database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: echo "key=site-db-${{ hashFiles('dcs-world-reference/latest/**', 'dcs-world-schema/**', 'tools/**', 'VERSION', 'uv.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore database
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/site-db
          key: ${{ steps.key.outputs.key }}

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Task
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install uv
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build database
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          task uv:sync
          task package:sqlite
          mkdir -p dist/site-db
          cp dist/dcs-world-reference-*-dcs*.sqlite dist/site-db/

      - uses: actions/upload-artifact@v4
        with:
          name: site-db
          path: dist/site-db
          retention-days: 1

  # The _G dump files the records point into ("View Lua"), from the dump's release asset
  # (tools/datamine/dump_lua.py: tag dcs-dump-<DCS version>, asset dcs-g-dump-<version>.tar.gz).
  lua:
    name: Collect Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump release
        id: dump
        run: |
          version="$(jq -r .dcsVersion dcs-world-reference/latest/manifest.json)"
          {
            echo "tag=dcs-dump-$version"
            echo "asset=dcs-g-dump-$version.tar.gz"
            echo "key=site-lua-$version-${{ hashFiles('dcs-world-reference/latest/**', 'tools/datamine/dump_lua.py', 'tools/datamine/dump_paths.py', 'tools/datamine/common.py', 'uv.lock') }}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Lua
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/site-lua
          key: ${{ steps.dump.outputs.key }}

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Lua
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install uv
          gh release download "${{ steps.dump.outputs.tag }}" --pattern "${{ steps.dump.outputs.asset }}" --dir .datamine
          uv run python -m tools.datamine.dump_lua collect --archive ".datamine/${{ steps.dump.outputs.asset }}" --out dist/site-lua

      - uses: actions/upload-artifact@v4
        with:
          name: site-lua
          path: dist/site-lua
          retention-days: 1

  deploy:
    name: Deploy
    needs: [shell, database, lua]
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: site-shell
          path: public

      - uses: actions/download-artifact@v4
        with:
          name: site-db
          path: db

      - uses: actions/download-artifact@v4
        with:
          name: site-lua
          path: lua

      - name: Split database
        run: node site/scripts/split-sqlite.ts public --mode=chunked --db="$(ls db/*.sqlite)"

      - name: Add Lua
        env:
          SITE_LUA: lua
          SITE_LUA_REQUIRED: "1"
        run: node site/scripts/copy-lua-assets.ts public

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'dcs-world-schema' }} --branch=main
