name: DCS World Schema CI

on:
  # The site has its own workflow (site.yml); changes only to it skip schema CI.
  push:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-validate:
    name: 🔨 Build and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install uv and Task
        run: |
          pip install uv
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
            
      - name: Pinned tool versions
        id: tools
        run: |
          selene=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' tools/selene.py)
          staticcheck=$(sed -n 's/^  STATICCHECK_VERSION: //p' Taskfile.yml)
          echo "key=selene-$selene-staticcheck-$staticcheck" >> "$GITHUB_OUTPUT"

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ${{ runner.os }}-tools-${{ steps.tools.outputs.key }}-${{ hashFiles('packages/go/go.mod') }}

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache: false

      - name: Validate, test and package
        run: task ci

      - name: Generate statistics
        id: stats
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Schema Statistics"
          TYPES_COUNT=$(grep -o '"types":' dist/dcs-world-api-schema.json | wc -l)
          GLOBALS_COUNT=$(grep -o '"globals":' dist/dcs-world-api-schema.json | wc -l)
          TOTAL_SIZE=$(wc -c < dist/dcs-world-api-schema.json)
          echo "TYPES_COUNT=$TYPES_COUNT" >> $GITHUB_ENV
          echo "GLOBALS_COUNT=$GLOBALS_COUNT" >> $GITHUB_ENV
          echo "TOTAL_SIZE=$TOTAL_SIZE" >> $GITHUB_ENV
          echo "::endgroup::"
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo } } = context;
            github.rest.issues.createComment({
              issue_number,
              owner,
              repo,
              body: `## DCS Schema Stats
              
              | Metric | Count |
              | ------ | ----- |
              | Types | ${{ env.TYPES_COUNT }} |
              | Globals | ${{ env.GLOBALS_COUNT }} |
              | Total Size | ${{ env.TOTAL_SIZE }} bytes |
              
              ✅ All validation checks passed!`
            });
