name: DCS World Schema CD

on:
  workflow_run:
    workflows: ["DCS World Schema CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install uv and Task
        run: |
          pip install uv
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: task uv:sync
        
      - name: Check whether the version tag exists
        id: check_version
        run: |
          # Ensure tags are fetched
          git fetch --tags --force
          
          # Read current version from VERSION file
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "Current version: $VERSION"
          
          # Check if this version tag already exists
          VERSION_TAG="v$VERSION"
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists, skipping release."
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION_TAG does not exist, creating release."
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          fi
          
      - name: Determine release type and RC number
        id: release_type
        run: |
          if [[ "${{ github.event.workflow_run.event }}" == "pull_request" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_prefix=Release Candidate" >> $GITHUB_OUTPUT
            
            # Get the current version
            VERSION=$(cat VERSION)
            
            # Find existing RC tags for this version to determine next RC number
            git fetch --tags
            EXISTING_RCS=$(git tag -l "v${VERSION}-rc*" | sort -V)
            
            if [ -z "$EXISTING_RCS" ]; then
              # No existing RCs, start with rc1
              RC_NUM=1
            else
              # Get the latest RC number and increment it
              LATEST_RC=$(echo "$EXISTING_RCS" | tail -n 1)
              LATEST_RC_NUM=$(echo "$LATEST_RC" | grep -o 'rc[0-9]*' | sed 's/rc//')
              RC_NUM=$((LATEST_RC_NUM + 1))
            fi
            
            echo "rc_suffix=-rc${RC_NUM}" >> $GITHUB_OUTPUT
            echo "rc_number=${RC_NUM}" >> $GITHUB_OUTPUT
            echo "Creating Release Candidate ${RC_NUM} for version ${VERSION}"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_prefix=Release" >> $GITHUB_OUTPUT
            echo "rc_suffix=" >> $GITHUB_OUTPUT
            echo "rc_number=" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Node
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Set up Go
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache: false

      - name: Build outputs and packages
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          task clean
          task merge
          task build
          task package

      # Each pattern must match exactly one file; the list feeds the release.
      - name: Collect release assets
        if: steps.check_version.outputs.version_changed == 'true'
        id: assets
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          patterns=(
            dist/dcs-world-api-schema.json
            dist/dcs-world-api-schema.yaml
            dist/dcs-world-api.lua
            dist/dcs-world-selene.yml
            dist/dcs-world-api.d.ts
            dist/dcs-world-api.go
            dist/dcs_world_api.py
            dist/dcs-world-api-hooks-schema.json
            dist/dcs-world-api-hooks.lua
            dist/dcs-world-api-hooks.d.ts
            dist/dcs-world-api-export-schema.json
            dist/dcs-world-api-export.lua
            dist/dcs-world-api-export.d.ts
            dist/dcs-world-entities.schema.json
            "dist/dcs-world-reference-$VERSION.tgz"
            "dist/dcs_world_reference-$VERSION-py3-none-any.whl"
            "dist/dcs_world_reference-$VERSION.tar.gz"
            "dist/dcs-world-reference-lua-$VERSION-dcs*.zip"
            "dist/dcs-world-reference-$VERSION-dcs*.sqlite"
          )
          files=()
          for pattern in "${patterns[@]}"; do
            # shellcheck disable=SC2206 # the pattern is globbed on purpose
            matches=($pattern)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "::error::$pattern matches ${#matches[@]} files: ${matches[*]}"
              exit 1
            fi
            files+=("${matches[0]}")
          done
          ls -l "${files[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The Go module's generated files are gitignored on main, but `go get` needs
      # them at the tag: commit them off this commit and tag v<version> and
      # packages/go/v<version>; the release below reuses v<version>.
      - name: Tag the Go module release commit
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          task package:go-release -- --tag "v${{ steps.check_version.outputs.version }}${{ steps.release_type.outputs.rc_suffix }}" --push

      - name: Extract the version's changelog
        if: steps.check_version.outputs.version_changed == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          
          # Extract changelog section for current version
          CHANGELOG_CONTENT=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          
          # Remove any trailing whitespace and ensure we have content
          CHANGELOG_CONTENT=$(echo "$CHANGELOG_CONTENT" | sed '/^$/d')
          
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "No changelog content found for version $VERSION"
            CHANGELOG_CONTENT="No changelog entries found for this version."
          fi
          
          # Save changelog content to output (escape for GitHub Actions)
          echo "changelog_content<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        if: steps.check_version.outputs.version_changed == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}${{ steps.release_type.outputs.rc_suffix }}
          name: ${{ steps.release_type.outputs.is_prerelease == 'true' && 'Release Candidate' || 'Release' }} v${{ steps.check_version.outputs.version }}${{ steps.release_type.outputs.rc_number && ' RC' || '' }}${{ steps.release_type.outputs.rc_number }}
          body: |
            ## DCS World Schema ${{ steps.release_type.outputs.release_prefix }} v${{ steps.check_version.outputs.version }}${{ steps.release_type.outputs.rc_number && ' RC' || '' }}${{ steps.release_type.outputs.rc_number }}
            
            This ${{ steps.release_type.outputs.release_prefix }} contains ${{ steps.release_type.outputs.is_prerelease == 'true' && 'development' || 'updated' }} schema definitions for DCS World API.
            
            ## 📋 Changes in this Release
            
            ${{ steps.changelog.outputs.changelog_content }}
            
            ## 📦 Assets

            - `dcs-world-api-schema.json`, `.yaml`: merged mission scripting schema
            - `dcs-world-api.lua`: EmmyLua annotations for LuaLS
            - `dcs-world-selene.yml`: Selene standard library
            - `dcs-world-api.d.ts`, `.go`, `dcs_world_api.py`: TypeScript, Go, Python definitions (experimental)
            - `dcs-world-api-hooks-*`, `dcs-world-api-export-*`: schema, EmmyLua and TypeScript for the hooks and export environments
            - `dcs-world-entities.schema.json`: JSON Schema of the reference-data records
            - `dcs-world-reference-<version>.tgz`: npm package (`npm install <file>`)
            - `dcs_world_reference-<version>-py3-none-any.whl`, `.tar.gz`: Python package (`pip install <file>`)
            - `dcs-world-reference-lua-<version>-dcs<dcs version>.zip`: Lua 5.1 / DCS package
            - `dcs-world-reference-<version>-dcs<dcs version>.sqlite`: reference data as SQLite
          files: ${{ steps.assets.outputs.files }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Report release
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
            echo "::notice title=Release Candidate Created::New Release Candidate v${{ steps.check_version.outputs.version }} RC${{ steps.release_type.outputs.rc_number }} has been created successfully!"
          else
            echo "::notice title=Release Created::New Release v${{ steps.check_version.outputs.version }} has been created successfully!"
          fi
